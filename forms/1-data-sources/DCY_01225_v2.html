<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DCY 01225 — Routine Trip Permission (Rev. 6/2025) · fillable</title>
<meta name="fk-form-version" content="v2">
<link rel="stylesheet" href="form-kit.css?v=51">
<style>
  /* ===================================================================
     DCY 01225 (Rev. 6/2025) — Routine Trip Permission for Child Care.
     ОВЕРЛЕЙ НАД ОФИЦИАЛЬНЫМ СКАНОМ (1275x1650 @150dpi, letter): печать
     обязана быть неотличима от бланка штата — скан И ЕСТЬ вёрстка, мы
     только кладём поля. Координаты сняты от ФОНА: три серые полосы
     распознаны по картинке (y 220-284, 583-647, 774-837), остальное
     размечено от них и сверяется глазами (канон калибровки).
     ⚠️ КООРДИНАТЫ — ПЕРВЫЙ ПРОХОД, как это было и у 01234 v8. Три серые полосы найдены
     ПО КАРТИНКЕ (y 220-284, 583-647, 774-837) и держат разметку; остальное размечено от
     них и проверено глазами по снимку. 1:1 сверка на бумаге — за владельцем: печать
     обязана совпасть с бланком штата, а этого не докажет ни одна проба в браузере.
     =================================================================== */
  :root{ --line:#0066cc; }
  *{box-sizing:border-box}
  body{margin:0;background:#5a6b60;font-family:Arial,Helvetica,sans-serif}
  .doc{padding:20px 0 60px}
  .page{position:relative;width:1275px;height:1650px;margin:0 auto 20px;background:#fff no-repeat;
    background-size:1275px 1650px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
  .page.p1{background-image:url("DCY01225_page-1.png")}
  /* 2.11: «Reset Form» is printed inside the state's picture of the blank — closed on the screen and on paper */
  .resetcover{position:absolute;left:566px;top:995px;width:166px;height:56px;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .notsub{display:none}
  .f{position:absolute;font-family:Arial,sans-serif;font-size:15px;color:#111;
    background:rgba(255,253,150,0.55);border:none;border-bottom:1.5px solid var(--line);
    padding:1px 4px;outline:none}
  .f:focus{background:rgba(255,246,120,0.8)}
  .cb{position:absolute;width:18px;height:18px;margin:0;accent-color:#0f4c35;cursor:pointer}
  .modelbl{position:absolute;font:600 10.5px Arial,sans-serif;color:#0f4c35;white-space:nowrap;transform:translateX(-50%);pointer-events:none}
  .sig{position:absolute;background:rgba(210,235,255,0.35);border:1.5px dashed #0f4c35;border-radius:4px;cursor:crosshair;display:block}
  .siglock{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;
    background:rgba(90,107,96,.9);color:#fff;font-size:12px;font-weight:700;border-radius:4px;padding:4px;z-index:5}
  .sigclear{position:absolute;font-size:10px;padding:2px 6px;background:#c0392b;color:#fff;border:none;border-radius:4px;cursor:pointer;z-index:6}
  /* Подсказка про разрешение на плавание — рядом со своим вопросом, не в углу. */
  .swimnote{position:absolute;left:130px;top:578px;width:1010px;font:600 13px Arial,sans-serif;
    color:#92400e;background:#fffbeb;border-left:3px solid #f59e0b;border-radius:4px;padding:5px 9px;z-index:4}
  @media print{
    body{background:#fff}.doc{padding:0}.page{box-shadow:none;margin:0}
    .f{background:transparent;border:none}
    .siglock,.sigclear,.swimnote,.modelbl{display:none!important}.sig{background:transparent;border:none}
    /* 2.11: the blank is a background, the browser drops it unless told; 1275 px is scaled to the 8.5 in sheet, one blank = one sheet */
    html,body{width:8.5in;height:auto}
    .page{zoom:.64;height:1649px;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .notsub{display:block;position:absolute;left:0;right:0;top:30px;text-align:center;font:700 22px Arial,sans-serif;color:#b91c1c;z-index:7}
    .notsub[hidden]{display:none}
    @page{size:8.5in 11in;margin:0}
  }
.fkml{margin:6px 0;padding:8px 10px;border:1.5px solid #fcd34d;background:#fffbeb;border-radius:8px;font:13px Arial,Helvetica,sans-serif;color:#92400e}
.fkml-head{font-weight:700;margin-bottom:4px}
.fkml-item{display:block;width:100%;text-align:left;background:none;border:none;padding:2px 0;color:#92400e;text-decoration:underline;cursor:pointer;font:inherit}
</style>
</head>
<body>
<!-- ⭐ ЧТО ПРОСТАВИЛ ЦЕНТР — СКАЗАНО СЛОВАМИ, А НЕ ТОЛЬКО СЕРЫМИ КЛЕТКАМИ.
     Серое поле объясняет «нельзя менять», но не объясняет ЧТО и КЕМ утверждено.
     Родитель подписывает документ — он должен прочесть его состав, а не догадаться. -->
<div id="preset-note" style="display:none;max-width:1200px;margin:10px auto 0;padding:10px 14px;
  background:#f2f7f4;border:1.5px solid #cfe0d5;border-radius:9px;font:13px/1.5 Arial,sans-serif;color:#14281f">
  <b>Your center filled this in for the trip to and from school.</b>
  The destination, the vehicle and both water questions are set by the center and shown greyed —
  they print exactly as you see them. <b>Your part:</b> choose the car seat category, then sign and date.
</div>

<div data-formkit="missing-list" class="fkml fk-print-hidden" style="display:none"></div>
<div class="doc"><div class="page p1" id="pg1"><div class="resetcover" aria-hidden="true"></div></div></div>

<script>
/* Клетки бланка — СЛОВО В СЛОВО с оригинала DCY 01225 (Rev. 6/2025).
   x/y — левый верхний угол поля на скане 1275x1650. */
var FIELDS = [
  /* ── Routine Trip Information ─────────────────────────────────────── */
  /* ⭐ 1.11 (канон 30.10, слово владельца «онлайн-форму 01225 менять»): пункт назначения — ЖИВОЙ список школ центра, отмеченных
     «we transport here» в Settings → Schools; читается при КАЖДОМ открытии бланка (дверь center_transport_schools), а не вшит в бланк.
     Галочку сняли / школу переименовали — следующее открытие показывает это сразу. В подаче хранится выбранное: имя на момент
     подписи (destinations) и id школы (school_id); подписанная форма задним числом не меняется. Свободного ввода нет. */
  {id:'destinations',    t:'school',x:132,y:312,w:1005,h:30,r:1,label:'Routine trip destination(s)'},
  {id:'permission_date', t:'text',x:132,y:378,w:300,h:30,r:1,date:1,ph:'MM/DD/YYYY',
     label:'Date of permission (valid for one year)'},

  /* ⭐ MODE: на бумаге это ОДНА строка со списком в скобках. Владелец (21.08) выбрал
     пять галочек ПЛЮС «other»: ответ становится машиночитаемым — водителю нужен именно
     он, — а лист остаётся тем же, способы на бумаге и так напечатаны.
     ⭐⭐ КАЖДАЯ ГАЛОЧКА СТОИТ ПОД СВОИМ СЛОВОМ. Пять безымянных квадратиков — это
     загадка: родитель не обязан догадываться, какой из них «school bus». Подписывать их
     своими словами нельзя (печать обязана остаться официальным бланком), поэтому
     подпись даёт САМ БЛАНК — та самая строка в скобках над ними.
     Обязательна ГРУППА: любая отметка либо текст в «other» закрывает вопрос. */
  {id:'mode_walk',    t:'cb',x:556,y:436,excl:'mode',r:1,label:'Mode of transportation'},
  {id:'mode_bus',     t:'cb',x:638,y:436,excl:'mode'},
  {id:'mode_public',  t:'cb',x:740,y:436,excl:'mode'},
  {id:'mode_parent',  t:'cb',x:876,y:436,excl:'mode'},
  {id:'mode_provider',t:'cb',x:996,y:436,excl:'mode'},
  {id:'mode_other',   t:'text',x:132,y:456,w:390,h:20,ph:'other (describe)'},

  /* ⛔ ВОДА — ДВА РАЗНЫХ ВОПРОСА, и оба обязательны. Ни один не предзаполняется:
     это единственные клетки бланка про безопасность ребёнка, и «нет», поставленное
     нами и подписанное семьёй, было бы нашим ответом за её подписью.
     Клетки положены ПОВЕРХ печатных квадратиков бланка. */
  {id:'water_y', t:'cb',x:140,y:501,excl:'water',r:1,label:'Access to water 18 inches or deeper — yes or no'},
  {id:'water_n', t:'cb',x:312,y:501,excl:'water'},
  {id:'wact_y',  t:'cb',x:772,y:544,excl:'wact',r:1,label:'Water activities planned — yes or no'},
  {id:'wact_n',  t:'cb',x:892,y:544,excl:'wact'},

  /* ── Child's Information ──────────────────────────────────────────── */
  {id:'child_name', t:'text',x:132,y:678,w:1005,h:30,r:1,fk:'child_name',ac:'name',label:'Child name'},

  /* ⛔ КАТЕГОРИЯ КРЕСЛА НЕ ВЫВОДИТСЯ ИЗ ДАТЫ РОЖДЕНИЯ: на бумаге она про вес и рост
     тоже («40 lbs», «4' 9"»), и решает её родитель. */
  {id:'seat_under4', t:'cb',x:143,y:742,excl:'seat',r:1,label:'Car seat category'},
  {id:'seat_over4',  t:'cb',x:497,y:742,excl:'seat'},
  {id:'seat_8yr',    t:'cb',x:798,y:742,excl:'seat'},

  /* ── Signature ────────────────────────────────────────────────────── */
  {id:'parent_sig',    t:'sig', x:132,y:934,w:690,h:46,r:1,label:'Parent signature'},
  {id:'parent_sig_dt', t:'text',x:880,y:938,w:240,h:26,label:'Date'}
];

function g(id){var e=document.getElementById('f_'+id);if(!e)return '';
  if(e.tagName==='SELECT') return e.value?((e.options[e.selectedIndex]||{}).text||'').trim():'';   /* the school's name as chosen */
  return e.type==='checkbox'?(e.checked?'Yes':''):(e.value||'').trim()}
function gc(id){var e=document.getElementById('f_'+id);return !!(e&&e.checked)}

(function(){
  var host=document.getElementById('pg1');
  FIELDS.forEach(function(f){
    var el;
    if(f.t==='cb'){
      el=document.createElement('input'); el.type='checkbox'; el.className='cb';
      el.style.left=f.x+'px'; el.style.top=f.y+'px';
      if(f.excl) el.setAttribute('data-fk-exclusive',f.excl);
    } else if(f.t==='sig'){
      el=document.createElement('canvas'); el.className='sig'; el.width=f.w; el.height=f.h;
      el.setAttribute('data-formkit','signature'); el.setAttribute('data-fk-adopt','');
      el.style.cssText='left:'+f.x+'px;top:'+f.y+'px;width:'+f.w+'px;height:'+f.h+'px';
      el.style.pointerEvents='none';                 /* подписываем через FKPad — «рисуй крупно» */
      if(f.r){el.setAttribute('data-required','');el.setAttribute('data-label',f.label||f.id)}
      var cb=document.createElement('button');cb.type='button';cb.className='sigclear';cb.textContent='✕';
      cb.style.left=(f.x+f.w-22)+'px';cb.style.top=(f.y+2)+'px';
      cb.onclick=function(){FormKit.clearSig(el);gate()};
      host.appendChild(cb);
      var lock=document.createElement('div');lock.className='siglock';lock.id='lock_'+f.id;
      lock.style.cssText='left:'+f.x+'px;top:'+f.y+'px;width:'+f.w+'px;height:'+f.h+'px';
      lock.textContent='Complete the required fields first';
      /* Замок И ЕСТЬ открывашка окна подписи — кит второй кнопки не ставит (v23). */
      lock.setAttribute('data-fk-pad','f_'+f.id);
      host.appendChild(lock);
    } else if(f.t==='school'){
      el=document.createElement('select'); el.className='f';
      el.style.cssText='left:'+f.x+'px;top:'+f.y+'px;width:'+f.w+'px;height:'+f.h+'px';
      var o=document.createElement('option'); o.value=''; o.textContent='Loading the center\u0027s schools\u2026'; el.appendChild(o);
    } else {
      el=document.createElement('input'); el.type='text'; el.className='f';
      el.style.cssText='left:'+f.x+'px;top:'+f.y+'px;width:'+f.w+'px;height:'+f.h+'px';
      if(f.ph) el.placeholder=f.ph;
      if(f.ac) el.setAttribute('autocomplete',f.ac);
      if(f.date) el.setAttribute('data-fk-date','1');
    }
    el.id='f_'+f.id;
    if(f.fk) el.setAttribute('data-fk-field',f.fk);
    if(f.r && f.t!=='sig'){ el.setAttribute('data-required',''); el.setAttribute('data-label',f.label||f.id) }
    /* «other» закрывает вопрос о способе наравне с галочками. */
    if(f.id==='mode_walk') el.setAttribute('data-required-alt','f_mode_other');
    host.appendChild(el);
    if(f.t==='text') el.addEventListener('input',gate);
    if(f.t==='school') el.addEventListener('change',gate);
    /* 1.11 (defect on the owner's phone 9:44 AM ET): the kit re-checks the «required» line only on the field that carries it (mode_walk);
       a tick on any other box of the question (or «other») left «Mode of transportation is required» on screen while the question was
       answered. Every member of the question now asks the kit to re-check that one line. The kit itself is not touched (all forms share it). */
    if(f.id==='mode_other'){   /* «other» answers the mode question too (data-required-alt) — it asks for the same re-check */
      el.addEventListener('input', function(){ var w=document.getElementById('f_mode_walk'); if(w) w.dispatchEvent(new Event('change')); });
    }
    if(f.t==='cb') el.addEventListener('change',gate);
  });

  /* 1.11 (owner's direct word «подписи под квадратиками формы 01225»): the blank's OWN words under each box, on the screen only —
     the print stays the official blank (.modelbl is hidden in @media print); the words are the blank's line in brackets, not ours. */
  [['mode_walk','walking'],['mode_bus','school bus'],['mode_public','public transportation'],['mode_parent','parent vehicles'],['mode_provider','provider vehicle and driver']]
    .forEach(function(m){ var f=FIELDS.filter(function(x){return x.id===m[0]})[0]; if(!f) return;
      var l=document.createElement('div'); l.className='modelbl'; l.setAttribute('data-mode-label',m[0]);
      l.style.left=(f.x+9)+'px'; l.style.top=(f.y+21)+'px'; l.textContent=m[1]; host.appendChild(l); });

  /* Подсказка про плавание — появляется у СВОЕГО вопроса и только при «Yes». */
  var note=document.createElement('div'); note.className='swimnote fk-print-hidden';
  note.id='swimnote'; note.style.display='none';
  note.textContent='A swimming permission slip is required — the center will give it to you.';
  host.appendChild(note);
  gate();
})();

/* 1.11 (owner's word «сделайте исправление ещё 7 мест»): a question «one of» (excl) carries «required» on ONE box; the kit re-checks the
   red «… is required» line only on that box (form-kit initValidation). Every other box of the question asks the kit to re-check that one
   line, so a tick on any answer clears it. The kit itself is not touched (all forms share it; IEA is frozen, §L5). */
(function groupRequiredRecheck(){
  var req={}; FIELDS.forEach(function(f){ if(f.excl && f.r) req[f.excl]=f.id; });
  FIELDS.forEach(function(f){
    if(!f.excl || f.r || !req[f.excl]) return;
    var el=document.getElementById('f_'+f.id); if(!el) return;
    el.addEventListener('change', function(){ var r=document.getElementById('f_'+req[f.excl]); if(r) r.dispatchEvent(new Event('change')); });
  });
})();

/* ⭐ ЖИВОЙ СПИСОК ШКОЛ (1.11). Читается при открытии; отказ чтения сказан словами (§L2) — пустой список ≠ «школ нет». */
var SCHOOL_WANT=null;   /* the school named by the family's 01234 / the link, chosen once the list is in */
function schoolsLine(text){
  var sel=document.getElementById('f_destinations'); if(!sel) return;
  if(sel.value) return;   /* 2.11: a filed blank in View carries its school — a word about the list never replaces it */
  sel.innerHTML=''; var o=document.createElement('option'); o.value=''; o.textContent=text; sel.appendChild(o);
}
/* 2.11: View of a filed form — the school as it was signed, never the live list (blankFiller calls this) */
window.__afterFill=function(fd){
  var sel=document.getElementById('f_destinations'), name=fd&&fd.destinations; if(!sel||!name) return;
  sel.innerHTML=''; var o=document.createElement('option'); o.value=fd.school_id||String(name); o.textContent=name; sel.appendChild(o); sel.value=o.value;
};
function pickSchool(name){
  var sel=document.getElementById('f_destinations'); if(!sel||!name) return false;
  var key=String(name).replace(/^\s*school\s*[-\u2013\u2014:]\s*/i,'').replace(/\s+/g,' ').trim().toLowerCase();
  for(var i=0;i<sel.options.length;i++){
    if(sel.options[i].value && sel.options[i].text.replace(/\s+/g,' ').trim().toLowerCase()===key){
      sel.value=sel.options[i].value; sel.dispatchEvent(new Event('change',{bubbles:true})); return true;
    }
  }
  return false;
}
function loadSchools(tries){
  /* the kit names the center in its own boot (after this page's listener; an embed even later) — wait for it, up to 5 s */
  var center=window.FormKit&&FormKit.centerUuid&&FormKit.centerUuid();
  if(!center && (tries||0)<20){ setTimeout(function(){ loadSchools((tries||0)+1); },250); return; }
  if(!center){ schoolsLine('Please open this form from your center\u0027s link to see its list of schools.'); return; }
  fetch(FormKit.supa.url+'/rest/v1/rpc/center_transport_schools',{method:'POST',headers:FormKit.supa.headers,body:JSON.stringify({p_center:center})})
    .then(function(r){ if(!r.ok) throw new Error(String(r.status)); return r.json(); })
    .then(function(rows){
      var sel=document.getElementById('f_destinations'); if(!sel||sel.value) return;
      if(!rows||!rows.length){ schoolsLine('The center has not listed its schools yet \u2014 ask the center.'); return; }
      sel.innerHTML='';
      var o=document.createElement('option'); o.value=''; o.textContent='Choose your child\u0027s school'; sel.appendChild(o);
      rows.forEach(function(s){ var x=document.createElement('option'); x.value=s.id; x.textContent=s.name; sel.appendChild(x); });
      if(SCHOOL_WANT && pickSchool(SCHOOL_WANT)) lockCell('destinations');
      if(window.FormKit && FormKit.refreshCounter) FormKit.refreshCounter();
      gate();
    })
    .catch(function(){ schoolsLine('The list of schools could not be loaded. Check your connection and reload the page.'); });
}
document.addEventListener('DOMContentLoaded', function(){ loadSchools(0); });

function swimNote(){
  var n=document.getElementById('swimnote'); if(!n) return;
  n.style.display = gc('wact_y') ? '' : 'none';
}
/* Дата рядом с подписью — ШТАМП: ставится в момент подписи, только чтение, гаснет
   вместе с подписью (канон 24.07). */
function fmtToday(){var t=new Date();return ('0'+(t.getMonth()+1)).slice(-2)+'/'+('0'+t.getDate()).slice(-2)+'/'+t.getFullYear()}
function stampSigDate(){
  var dt=document.getElementById('f_parent_sig_dt'); if(!dt) return;
  var signed=window.FormKit&&FormKit.getSig&&FormKit.getSig('f_parent_sig');
  dt.readOnly=true; dt.value = signed ? (dt.value||fmtToday()) : '';
}
window.__stampSigDates = stampSigDate;

function requiredFilled(){
  /* Один предикат на один вопрос: спрашиваем кит, а не свой обход (канон v22). */
  /* ⛔ ПОДПИСЬ НЕ СТЕРЕЖЁТ САМУ СЕБЯ. Замок открывается, когда заполнено всё ОСТАЛЬНОЕ;
     считать её саму в этот счёт значит запереть подпись навсегда — «заполните
     обязательные» висело бы на форме, где не заполнена ровно она.
     ⚠️ Дефект внесён 21.08 вместе с «одним предикатом» (v22): прежний обход полей
     подписи исключал (`f.t!=='sig'`), а кит их считает. Поймано пробой 01225. */
  if(window.FormKit&&FormKit.refreshCounter)
    return FormKit.refreshCounter().filter(function(e){return e.tagName!=='CANVAS'}).length===0;
  return false;
}
function gate(){
  swimNote();
  var ok=requiredFilled();
  var signed=window.FormKit&&FormKit.getSig&&!!FormKit.getSig('f_parent_sig');
  var lock=document.getElementById('lock_parent_sig');
  if(lock){
    if(signed){ lock.style.display='none'; lock.onclick=null }
    else if(!ok){ lock.style.display='flex'; lock.textContent=(window.FormKit&&FormKit.plateWords&&FormKit.plateWords(FormKit.refreshCounter()))||'Complete the required fields first'; lock.onclick=null }
    else { lock.style.display='flex'; lock.textContent='✍ Tap to sign — draw big';
           lock.onclick=function(){ if(window.FKPad) FKPad.open('f_parent_sig',{title:'Parent signature'}) } }
  }
  stampSigDate();
}
/* ⭐ ПОДПИСЬ СООБЩАЕТ О СЕБЕ САМА. Кит после «Use signature» шлёт на канву `fk:ink` —
   это ЕДИНСТВЕННЫЙ надёжный сигнал. До этой строки замок гас лишь потому, что палец,
   отпущенный над кнопкой площадки, попутно поднимал общий mouseup; мышью-без-отпускания,
   стилусом или программной подписью замок оставался поверх уже поставленной подписи и
   продолжал звать «Tap to sign». Родитель читал бы это как «не подписалось». */
document.addEventListener('fk:ink', function(){ setTimeout(gate,10) }, true);
document.addEventListener('mouseup', function(){ setTimeout(gate,50) });
document.addEventListener('touchend', function(){ setTimeout(gate,50) });

function resetForm(){
  FIELDS.forEach(function(f){
    var e=document.getElementById('f_'+f.id); if(!e) return;
    if(f.t==='sig') FormKit.clearSig(e); else if(f.t==='cb') e.checked=false; else e.value='';
  });
  gate(); if(window.FormKit&&FormKit.status) FormKit.status('Cleared','');
}

/* Префилл из пакета: имя ребёнка приходит единым пакетом семьи. */
function PA_APPLY(fd){
  var S=function(id,v){var e=document.getElementById('f_'+id); if(e&&v!=null&&!e.value) e.value=v};
  S('child_name', fd.child_name);
  /* ⭐ Школа — ответ семьи на 01234, приходит тем же пакетом. Пришла — ставим и запираем. */
  /* ⭐ ШКОЛА ПРИШЛА ПАКЕТОМ — ЗНАЧИТ ЭТО ШКОЛЬНАЯ ПОЕЗДКА, и пресет включается ЗДЕСЬ.
     Префилл приезжает после загрузки, поэтому решение о пресете принимается дважды: по
     адресу (если школа названа ссылкой) и по пакету (если пришла ответом семьи). */
  if(fd.school_name && PRESET!=='school_transport'){
    applySchoolTransportPreset(fd.school_name);
  }
}

/* ⭐ ПРЕСЕТ «ШКОЛЬНАЯ ПЕРЕВОЗКА» — ЦЕНТР ВЫДАЁТ ФОРМУ ЗАПОЛНЕННОЙ (решения владельца 23.08).
 *
 * ⛔ СМЕНА КАНОНА 21.08 ПО ВОДЕ — ОСОЗНАННАЯ, И ОНА СУЖЕНИЕ, А НЕ ОТМЕНА. Прежде вода
 * оставалась родителю: бланк вообще, маршрут неизвестен, спрашивать некого кроме семьи.
 * В ШКОЛЬНОМ пресете маршрут НАЗВАН ЦЕНТРОМ — отвезти в школу и обратно. Вода на этом
 * маршруте не вопрос к семье, а УТВЕРЖДЕНИЕ ЦЕНТРА О СОБСТВЕННОЙ ПОЕЗДКЕ, и отвечает за
 * него тот, кто её организует. Для любого иного маршрута вода возвращается родителю.
 * ⛔ КАТЕГОРИЯ КРЕСЛА ИЗ КАНОНА НЕ ВЫХОДИТ — её ставит родитель, как и было.
 *
 * ⛔ ЗАБЛОКИРОВАННОЕ ПЕЧАТАЕТСЯ И ВИДНО. Родитель должен видеть, что центр утверждает от
 * его имени; спрятав клетки, мы получили бы подписанный документ, содержания которого
 * подписавший не видел. Поэтому `readOnly`/`pointer-events`, а не `display:none`.
 *
 * ⭐ ШКОЛА ПРИХОДИТ ИЗ ОТВЕТА СЕМЬИ на 01234 (`school_name` рядом с `attends_school_age`),
 * а не выдумывается нами. Не пришла — клетка остаётся пустой с подсказкой: отправить
 * ребёнка по адресу, которого никто не называл, хуже пустой клетки.
 *
 * ⛔ ПРЕСЕТ ОБЪЯВЛЯЕТ СЕБЯ В ПОДАЧЕ (`preset:'school_transport'`). Через год никто не
 * ответит, почему в подписанной бумаге стои́т «воды нет» и была ли это рука родителя. */
var PRESET = null;

function lockCell(id, on){
  var e=document.getElementById('f_'+id); if(!e) return;
  if(e.type==='checkbox' || e.tagName==='SELECT'){ e.disabled=true; }
  else { e.readOnly=true; }
  e.style.background='#f3f5f4'; e.style.color='#6b7280'; e.style.cursor='not-allowed';
  e.setAttribute('data-preset-locked','1');
  e.setAttribute('title','Set by the center — cannot be changed here');
}
function setCb(id, on){
  var e=document.getElementById('f_'+id); if(!e) return;
  e.checked=!!on; e.dispatchEvent(new Event('change',{bubbles:true}));
}

function applySchoolTransportPreset(school){
  PRESET='school_transport';
  /* Транспорт: только «provider vehicle and driver». */
  setCb('mode_provider', true);
  ['mode_walk','mode_bus','mode_public','mode_parent'].forEach(function(id){ setCb(id,false); lockCell(id); });
  lockCell('mode_provider'); lockCell('mode_other');
  /* Вода — оба ответа «No», утверждением центра. */
  setCb('water_n', true);  setCb('water_y', false);
  setCb('wact_n',  true);  setCb('wact_y',  false);
  ['water_y','water_n','wact_y','wact_n'].forEach(lockCell);
  /* Куда возим — из ответа семьи на 01234. */
  /* 1.11: the school is CHOSEN from the live list by its name; not on the list → the parent chooses (nothing typed in) */
  if(school){ SCHOOL_WANT=school; if(pickSchool(school)) lockCell('destinations'); }
  /* Дата выдачи — ЦЕНТРА, не подписи родителя. */
  var d=document.getElementById('f_permission_date');
  if(d && !d.value){
    var t=new Date();
    d.value=('0'+(t.getMonth()+1)).slice(-2)+'/'+('0'+t.getDate()).slice(-2)+'/'+t.getFullYear();
    d.dispatchEvent(new Event('input',{bubbles:true}));
  }
  lockCell('permission_date');
  var note=document.getElementById('preset-note');
  if(note) note.style.display='';
  if(window.FormKit && FormKit.refreshCounter) FormKit.refreshCounter();
  gate();
}

/* ⛔ ПРЕСЕТ ПРИМЕНЯЕТСЯ ТОЛЬКО К ШКОЛЬНОЙ ПОЕЗДКЕ. ПОЙМАНО ЖИВОЙ ЧИТКОЙ 23.08.
   Первая редакция звала пресет НА КАЖДОМ открытии бланка — и общий 01225, выданный под
   любой иной маршрут, приходил с водой, запертой в «No». Это прямое нарушение границы,
   которую владелец назвал сам, вводя сужение канона: «только пресет school_transport; для
   любого иного маршрута водные вопросы ВОЗВРАЩАЮТСЯ РОДИТЕЛЮ».
   ⚠️ Цена ошибки — не косметика: центр утвердил бы «воды нет» на поездке, которой не
   называл, и родитель подписал бы это, не имея возможности ответить иначе.
   ⭐ ПРИЗНАК ПРЕСЕТА — НАЗВАННАЯ ШКОЛА либо явный ?preset=. Нет признака — бланк ведёт
   себя ровно как до 23.08: возит центр (это мы знаем), дата сегодняшняя, а вода и кресло
   остаются вопросами к родителю. */
function plainPrefill(){
  var m=document.getElementById('f_mode_provider');
  if(m && !m.checked){ m.checked=true; m.dispatchEvent(new Event('change',{bubbles:true})); }
  var d=document.getElementById('f_permission_date');
  if(d && !d.value){
    var t=new Date();
    d.value=('0'+(t.getMonth()+1)).slice(-2)+'/'+('0'+t.getDate()).slice(-2)+'/'+t.getFullYear();
    d.dispatchEvent(new Event('input',{bubbles:true}));
  }
  if(window.FormKit && FormKit.refreshCounter) FormKit.refreshCounter();
  gate();
}

(function bootPreset(){
  document.addEventListener('DOMContentLoaded', function(){
    var q=null, school='', preset='';
    try { q=new URLSearchParams(location.search); school=q.get('school')||''; preset=q.get('preset')||''; } catch(_){}
    if (school || preset==='school_transport') applySchoolTransportPreset(school);
    else plainPrefill();
  });
})();

/* 2.11 (owner): a copy printed before Submit says so on the paper. The blank in View is a filed form: blankFiller hides the line there. */
(function(){
  function mark(){
    var sent=!!(window.FormKit&&FormKit.submitState&&FormKit.submitState().submitted);
    Array.prototype.forEach.call(document.querySelectorAll('.page'),function(p){
      var n=p.querySelector('.notsub');
      if(!n){ n=document.createElement('div'); n.className='notsub'; n.textContent='Not submitted \u2014 this copy is not on file. Submit the form to save it.'; p.appendChild(n); }
      n.hidden=sent;
    });
  }
  window.addEventListener('load',mark);
  window.addEventListener('beforeprint',mark);
})();

window.FORMKIT_CONFIG = {
  formType:'dcy_01225', version:'v2', title:'Routine Trip Permission (DCY 01225)',
  formKey:'dcy_01225', reset:resetForm, applyPrefill:PA_APPLY,
  collect:function(){
    var fd={ type:'dcy_01225', dcy_form:'01225', dcy_version:'v2', center_code:FormKit.centerCode() };
    FIELDS.forEach(function(f){ if(f.t!=='sig') fd[f.id]=g(f.id) });
    /* Срок бланка — «valid for one year» ОТ ДАТЫ РОДИТЕЛЯ, а не от дня загрузки.
       Кладём его в подачу, чтобы карточка не пересчитывала его заново и не разошлась. */
    fd.valid_from = g('permission_date');
    /* ⛔ ПРЕСЕТ ОБЪЯВЛЯЕТ СЕБЯ: без этого через год не ответить, чья рука поставила «воды нет». */
    if(PRESET) fd.preset = PRESET;
    fd.mode_other = g('mode_other');
    /* 1.11: the chosen school by id (the live list); «destinations» keeps its name at signing */
    fd.school_id = (document.getElementById('f_destinations')||{}).value || null;
    fd.signature_method='drawn';
    return {
      formData: fd,
      signatures: { parent_sig: FormKit.getSig('f_parent_sig') },
      signatureDate: g('parent_sig_dt') || null
    };
  }
};
</script>

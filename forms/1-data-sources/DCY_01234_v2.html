  #toolbar { display: none; }
  .page-wrap { padding: 0; }
  .page-inner { box-shadow: none; margin: 0; page-break-after: always; }
  .f-tx, .f-ta, .f-ro { background: transparent !important; border-bottom: none !important; }

<script>

const SUPABASE_KEY = "sb_publishable_px0yZk-jUGwRlzEPiVjjXA_N6yYDSp9";

  "P_Guardian_Sig": "sig.parent_guardian_sig"
  "Sig_Date_2": "sig.sig_date2"
};

function setStatus(msg, type) {
  const s = document.getElementById('status');
  s.textContent = msg;
  s.className = type;
}

function getVal(id) {
  const el = document.getElementById(id);
  if (!el) return '';
  if (el.type === 'checkbox') return el.checked;
  return el.value;
}

function setVal(id, val) {
  const el = document.getElementById(id);
  if (!el) return;
  if (el.type === 'checkbox') el.checked = !!val;
  else el.value = val ?? '';
}

function clearAll() {
  document.querySelectorAll('.f-tx,.f-ta,.f-cb').forEach(el => {
    if (el.type === 'checkbox') el.checked = false;
    else el.value = '';
  });
  setStatus('Cleared', 'inf');
}

async function sb(method, path, body) {
  const res = await fetch(SUPABASE_URL + path, {
    method,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': method === 'POST' ? 'return=representation' : 'return=representation'
    },
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await res.json();
  if (!res.ok) throw new Error(JSON.stringify(data));
  return data;
}

async function loadFromDB() {
  const childId = document.getElementById('child-id-input').value.trim();
  if (!childId) { setStatus('Enter Child ID', 'err'); return; }
  setStatus('Loading...', 'inf');
  try {
    // Load child
    const [child] = await sb('GET', `/rest/v1/children?child_id=eq.${childId}&select=*`);
    if (!child) { setStatus('Child not found', 'err'); return; }
    setVal('Childs_Name', child.full_name);
    setVal('Date_of_Birth', child.date_of_birth);
    setVal('First_Day', child.enrollment_date);
    setVal('Child_Name_2', child.full_name);
    setVal('Child_Name_3', child.full_name);
    setVal('Child_Name_4', child.full_name);

    // Load center
    const [center] = await sb('GET', `/rest/v1/centers?center_id=eq.${child.center_id}&select=*`);
    if (center) {
      setVal('Center_Name_1', center.center_name);
      setVal('Center_Name_2', center.center_name);
    }

    // Load family
    if (child.family_id) {
      const [fam] = await sb('GET', `/rest/v1/families?family_id=eq.${child.family_id}&select=*`);
      if (fam) {
        setVal('Home_Address', fam.address_street);
        setVal('City', fam.address_city);
        setVal('State', fam.address_state || 'OH');
        setVal('Zip_Code', fam.address_zip);
        setVal('Home_Tel', fam.phone_home);
        setVal('P1_Name', (fam.parent1_first_name || '') + ' ' + (fam.parent1_last_name || ''));
        setVal('P1_Relation', fam.parent1_relationship);
        setVal('P1_Phone', fam.parent1_phone_home);
        setVal('P1_Email', fam.parent1_email);
        setVal('P1_Cell', fam.parent1_phone_cell);
        setVal('P1_Work_Name', fam.parent1_work_name);
        setVal('P1_Work_Tel', fam.parent1_phone_work);
        setVal('P2_Name', (fam.parent2_first_name || '') + ' ' + (fam.parent2_last_name || ''));
        setVal('P2_Relation', fam.parent2_relationship);
        setVal('P2_Email', fam.parent2_email);
        setVal('P2_Cell', fam.parent2_phone_cell);
        setVal('P2_Work_Name', fam.parent2_work_name);
        setVal('P2_Work_Tel', fam.parent2_phone_work);
      }
    }

    // Load contacts
    const contacts = await sb('GET', `/rest/v1/contacts?child_id=eq.${childId}&order=sort_order`);
    const ec = contacts.filter(c => c.contact_type === 'emergency');
    const phys = contacts.find(c => c.contact_type === 'physician');
    if (ec[0]) { setVal('EC1_Name', ec[0].contact_name); setVal('EC1_Phone', ec[0].phone_primary); setVal('EC1_Relation', ec[0].relationship); setVal('EC1_City', ec[0].city); setVal('EC1_State', ec[0].state); }
    if (ec[1]) { setVal('EC2_Name', ec[1].contact_name); setVal('EC2_Phone', ec[1].phone_primary); setVal('EC2_Relation', ec[1].relationship); setVal('EC2_City', ec[1].city); setVal('EC2_State', ec[1].state); }
    if (phys) { setVal('Physician', phys.contact_name); setVal('Phys_Addr', phys.address_street); setVal('Phys_City', phys.city); setVal('Phys_State', phys.state); setVal('Phys_Tel', phys.phone_primary); }

    // Load health
    const [health] = await sb('GET', `/rest/v1/health_info?child_id=eq.${childId}&select=*`);
    if (health) {
      setVal('Has_Allergy', health.has_allergies);
      setVal('No_Allergy', !health.has_allergies);
      setVal('Food_Allergy', (health.allergy_types||[]).includes('food'));
      setVal('Med_Allergy', (health.allergy_types||[]).includes('medication'));
      setVal('Env_Allergy', (health.allergy_types||[]).includes('environmental'));
      setVal('Text1', health.allergy_description);
      setVal('Has_Spec_Cond', health.has_special_condition);
      setVal('No_Spec_Cond', !health.has_special_condition);
      setVal('Text2', health.special_condition_notes);
      setVal('Has_Medication', health.uses_medication);
      setVal('No_Medication', !health.uses_medication);
      setVal('Text3', health.medication_notes);
      setVal('Has_Diet', health.has_dietary_restriction);
      setVal('No_Diet', !health.has_dietary_restriction);
      setVal('Text4', health.dietary_notes);
      setVal('Text5', health.history_notes);
      setVal('Text6', health.additional_notes);
      setVal('Text7', health.fears_notes);
      setVal('Text8', health.staff_notes);
    }

    setStatus('Loaded: ' + child.full_name, 'ok');
  } catch(e) {
    setStatus('Error: ' + e.message, 'err');
    console.error(e);
  }
}

async function saveToDB() {
  const childId = document.getElementById('child-id-input').value.trim();
  if (!childId) { setStatus('Enter Child ID', 'err'); return; }
  setStatus('Saving...', 'inf');
  try {
    // Save family
    const [child] = await sb('GET', `/rest/v1/children?child_id=eq.${childId}&select=child_id,family_id,center_id`);
    if (!child) { setStatus('Child not found', 'err'); return; }

    const p1name = (getVal('P1_Name')||'').trim().split(/\s+/);
    const p2name = (getVal('P2_Name')||'').trim().split(/\s+/);
    const famData = {
      address_street: getVal('Home_Address'),
      address_city: getVal('City'),
      address_state: getVal('State') || 'OH',
      address_zip: getVal('Zip_Code'),
      phone_home: getVal('Home_Tel'),
      parent1_first_name: p1name.slice(0,-1).join(' '),
      parent1_last_name: p1name.slice(-1)[0] || '',
      parent1_relationship: getVal('P1_Relation'),
      parent1_phone_home: getVal('P1_Phone'),
      parent1_email: getVal('P1_Email'),
      parent1_phone_cell: getVal('P1_Cell'),
      parent1_work_name: getVal('P1_Work_Name'),
      parent1_phone_work: getVal('P1_Work_Tel'),
      parent1_work_address: getVal('P1_Work_Addr'),
      parent2_first_name: p2name.slice(0,-1).join(' '),
      parent2_last_name: p2name.slice(-1)[0] || '',
      parent2_relationship: getVal('P2_Relation'),
      parent2_email: getVal('P2_Email'),
      parent2_phone_cell: getVal('P2_Cell'),
      parent2_work_name: getVal('P2_Work_Name'),
      parent2_phone_work: getVal('P2_Work_Tel'),
    };

    if (child.family_id) {
      await sb('PATCH', `/rest/v1/families?family_id=eq.${child.family_id}`, famData);
    } else {
      const [newFam] = await sb('POST', '/rest/v1/families', { ...famData, family_id: 'FAM-' + Date.now() });
      if (newFam) await sb('PATCH', `/rest/v1/children?child_id=eq.${childId}`, { family_id: newFam.family_id });
    }

    // Save health
    const healthData = {
      child_id: childId,
      has_allergies: getVal('Has_Allergy'),
      allergy_types: [getVal('Food_Allergy') && 'food', getVal('Med_Allergy') && 'medication', getVal('Env_Allergy') && 'environmental'].filter(Boolean),
      allergy_description: getVal('Text1'),
      has_special_condition: getVal('Has_Spec_Cond'),
      special_condition_notes: getVal('Text2'),
      uses_medication: getVal('Has_Medication'),
      medication_notes: getVal('Text3'),
      has_dietary_restriction: getVal('Has_Diet'),
      dietary_notes: getVal('Text4'),
      history_notes: getVal('Text5'),
      additional_notes: getVal('Text6'),
      fears_notes: getVal('Text7'),
      staff_notes: getVal('Text8'),
    };
    const [existH] = await sb('GET', `/rest/v1/health_info?child_id=eq.${childId}`);
    if (existH) await sb('PATCH', `/rest/v1/health_info?child_id=eq.${childId}`, healthData);
    else await sb('POST', '/rest/v1/health_info', healthData);

    setStatus('Saved!', 'ok');
  } catch(e) {
    setStatus('Error: ' + e.message, 'err');
    console.error(e);
  }
}

// Auto-load from URL param ?child_id=PRL-001
const params = new URLSearchParams(location.search);
if (params.get('child_id')) {
  document.getElementById('child-id-input').value = params.get('child_id');
  window.addEventListener('load', loadFromDB);
}

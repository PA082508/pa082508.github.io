function calcAge(){const d=g('f_dob');if(!d)return;const b=new Date(d),n=new Date();let a=n.getFullYear()-b.getFullYear();let m=n.getMonth()-b.getMonth();if(m<0||(m===0&&n.getDate()<b.getDate())){a--;m+=12}if(n.getDate()<b.getDate())m--;if(a<0){s('f_age','');return}s('f_age',a===0?Math.max(m,0)+' mo':a)}

async function rpc_(fd, sigs, sigDate){
  if(window.PA_EMBED&&PA_EMBED.active)return PA_EMBED.save(fd,sigs,sigDate);
  const r = await fetch(URL_+'/rest/v1/rpc/submit_enrollment_form',{

      p_submission_type:'cacfp_enrollment',p_form_data:fd,p_signatures:sigs,
      p_signature_date:sigDate,p_source:'online'})});
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}
async function save_(){
  if(needCenter())return;
  if(!g('f_child_name').trim()){st("\u26a0 Enter child's name on the form",'er');return}

    const schedule={};

      meals:Object.fromEntries(MEALS.map(m=>[m,gc(`cb_${d}_${m}`)]))}});

    const form_data={type:'cacfp_enrollment',center_code:document.getElementById('ctr').value,
      center_name:g('f_center'),child_name:g('f_child_name'),
      age:g('f_age'),birthdate:g('f_dob'),schedule,schedule_varies:gc('cb_varies'),
      day_phone:g('f_phone'),mailing:{street:g('f_street'),city:g('f_city'),zip:g('f_zip')},
      parent_birthdate:g('f_parent_dob'),parent_email:g('f_parent_email'),
      expires_on:expDate(sigDate).toISOString().split('T')[0]};
    const sigs={parent_sig:getSigData('f_parent_sig')};
    await rpc_(form_data,sigs,sigDate);
    calcExp();st('Submitted for center review','ok');
    const dn=document.getElementById('done');dn.style.display='block';
    setTimeout(()=>dn.style.display='none',6000);
  }catch(e){st('Error: '+e.message,'er');console.error(e)}
}
// Signature pad
function initSigPad(id){
  const canvas=document.getElementById(id);if(!canvas)return;
  const ctx=canvas.getContext('2d');
  ctx.strokeStyle='#000080';ctx.lineWidth=1.8;ctx.lineCap='round';ctx.lineJoin='round';
  let drawing=false,lx,ly;
  function pos(e){const r=canvas.getBoundingClientRect(),sx=canvas.width/r.width,sy=canvas.height/r.height,src=e.touches?e.touches[0]:e;return{x:(src.clientX-r.left)*sx,y:(src.clientY-r.top)*sy}}
  function dn(e){e.preventDefault();drawing=true;const p=pos(e);lx=p.x;ly=p.y;ctx.beginPath();ctx.arc(lx,ly,0.8,0,Math.PI*2);ctx.fill()}
  function mv(e){e.preventDefault();if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p.x,p.y);ctx.stroke();lx=p.x;ly=p.y}
  function up(){drawing=false}
  canvas.addEventListener('mousedown',dn);canvas.addEventListener('mousemove',mv);
  canvas.addEventListener('mouseup',up);canvas.addEventListener('mouseleave',up);
  canvas.addEventListener('touchstart',dn,{passive:false});
  canvas.addEventListener('touchmove',mv,{passive:false});
  canvas.addEventListener('touchend',up);
}
function clearSig(id){const c=document.getElementById(id);if(c)c.getContext('2d').clearRect(0,0,c.width,c.height)}
function getSigData(id){const c=document.getElementById(id);if(!c)return null;const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;return d.some((v,i)=>i%4===3&&v>0)?c.toDataURL('image/png'):null}

function PA_APPLY(fd){
  const S=(id,v)=>{const e=document.getElementById(id);if(e&&v!=null)e.value=v};
  const C=(id,v)=>{const e=document.getElementById(id);if(e)e.checked=!!v};
  S('f_center',fd.center_name);S('f_child_name',fd.child_name);
  S('f_dob',fd.birthdate);if(fd.birthdate&&typeof calcAge==='function')calcAge();
  S('f_phone',fd.day_phone);
  if(fd.mailing){S('f_street',fd.mailing.street);S('f_city',fd.mailing.city);S('f_zip',fd.mailing.zip)}
  S('f_parent_dob',fd.parent_birthdate);S('f_parent_email',fd.parent_email);
  C('cb_varies',fd.schedule_varies);
  if(fd.schedule)DAYS.forEach(d=>{const x=fd.schedule[d];if(!x)return;
    C('cb_'+d,x.in_care);
    S(`f_${d}_arr1`,x.arr1);S(`f_${d}_dep1`,x.dep1);S(`f_${d}_arr2`,x.arr2);S(`f_${d}_dep2`,x.dep2);
    if(x.meals)MEALS.forEach(m=>C(`cb_${d}_${m}`,x.meals[m]))});
}

const PA_EMBED=(function(){
  const q=new URLSearchParams(location.search);
  const active=q.get('embed')==='1';
  const st_={active,HOST:null,pend:{}};
  if(!active)return st_;
  document.documentElement.classList.add('pa-embed');
  const FORM_TYPE='cacfp_enrollment',FORM_VERSION='v7';
  const env=m=>Object.assign({__paEmbed:true,ns:'pa-embed',v:1},m);
  const send=m=>{if(st_.HOST)parent.postMessage(env(m),st_.HOST)};
  st_.save=(fd,sigs,sigDate)=>new Promise((res,rej)=>{
    const nonce=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2));
    st_.pend[nonce]={res,rej};
    send({type:'save',formType:FORM_TYPE,formData:fd,signatures:sigs||null,
      signatureDate:sigDate||null,nonce});
    setTimeout(()=>{if(st_.pend[nonce]){delete st_.pend[nonce];
      rej(new Error('No response from host'))}},20000);
  });
  async function init(){
    document.body.classList.add('pa-embed');
    try{
      const host=q.get('host'),reg=q.get('registry'),center=q.get('center');
      if(!host||!reg)throw 0;
      const r=await fetch(reg);if(!r.ok)throw 0;
      const j=await r.json();
      const allow=j.allowedParentOrigins||[];
      if(!allow.includes(host))throw 0;
      st_.HOST=host;
      if(center){const c=document.getElementById('ctr');
        if(c){c.value=center;if(typeof ctrPick==='function')ctrPick()}}
      window.addEventListener('message',ev=>{
        if(ev.origin!==st_.HOST)return;
        const d=ev.data;
        if(!d||d.__paEmbed!==true||d.ns!=='pa-embed'||d.v!==1)return;
        if(d.type==='saved'){const p=st_.pend[d.nonce];
          if(p){delete st_.pend[d.nonce];p.res(d)}}
        else if(d.type==='error'){const p=st_.pend[d.nonce];
          if(p){delete st_.pend[d.nonce];p.rej(new Error(d.message||'Host error'))}}
        else if(d.type==='inject'){try{
          if(d.reset&&typeof clear_==='function')clear_();
          if(d.center){const c=document.getElementById('ctr');
            if(c){c.value=d.center;if(typeof ctrPick==='function')ctrPick()}}
          if(d.prefill)PA_APPLY(d.prefill);
          send({type:'resize',height:document.documentElement.scrollHeight});
        }catch(e){console.error('inject',e)}}
        /* неизвестные type игнорируются (forward-compat) */
      });
      send({type:'ready',formType:FORM_TYPE,version:FORM_VERSION});
      const ro=new ResizeObserver(()=>send({type:'resize',
        height:document.documentElement.scrollHeight}));
      ro.observe(document.documentElement);
      send({type:'resize',height:document.documentElement.scrollHeight});
    }catch(e){
      document.body.innerHTML='<div style="font-family:Arial;padding:48px;text-align:center;color:#555;font-size:13pt">This form must be opened from the Play Academy application.</div>';
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
  else init();
  return st_;
})();

<script>
const URL_="https://rkabxzqcikojcphwrkty.supabase.co",KEY_="sb_publishable_px0yZk-jUGwRlzEPiVjjXA_N6yYDSp9";
function st(m,t){const e=document.getElementById('st');e.textContent=m;e.className=t}
function g(id){const e=document.getElementById(id);return e?e.value:''}
function s(id,v){const e=document.getElementById(id);if(e)e.value=v??''}
function clear_(){document.querySelectorAll('input[id^=f_],textarea[id^=f_]').forEach(e=>e.value='');st('Cleared','in')}
async function api(path){
  const r=await fetch(URL_+path,{headers:{'apikey':KEY_,'Authorization':'Bearer '+KEY_}});
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}
async function api_post(path,data,method='POST'){
  const r=await fetch(URL_+path,{method,headers:{'apikey':KEY_,'Authorization':'Bearer '+KEY_,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(data)});
  return r.json();
}
async function load_(){
  const cid=document.getElementById('cid').value.trim();
  if(!cid){st('Enter Child ID','er');return}
  st('Loading...','in');
  try{
    const [c]=await api(`/rest/v1/children?child_id=eq.${cid}&select=*`);
    if(!c){st('Not found','er');return}
    s('f_child_name',c.full_name);s('f_child2',c.full_name);s('f_child3',c.full_name);s('f_child4',c.full_name);
    s('f_dob',c.date_of_birth);s('f_start',c.enrollment_date);
    if(c.center_id){
      const [ctr]=await api(`/rest/v1/centers?center_id=eq.${c.center_id}&select=center_name`);
      if(ctr){s('f_center1',ctr.center_name);s('f_center2',ctr.center_name)}
    }
    if(c.family_id){
      const [f]=await api(`/rest/v1/families?family_id=eq.${c.family_id}&select=*`);
      if(f){
        s('f_addr',f.address_street);s('f_city',f.address_city);s('f_state',f.address_state||'OH');s('f_zip',f.address_zip);s('f_phone',f.phone_home);
        s('f_p1name',(f.parent1_first_name||'')+' '+(f.parent1_last_name||''));
        s('f_p1rel',f.parent1_relationship);s('f_p1phone',f.parent1_phone_home);s('f_p1email',f.parent1_email);s('f_p1cell',f.parent1_phone_cell);
        s('f_p1work',f.parent1_work_name);s('f_p1worktel',f.parent1_phone_work);
        s('f_p2name',(f.parent2_first_name||'')+' '+(f.parent2_last_name||''));
        s('f_p2rel',f.parent2_relationship);s('f_p2email',f.parent2_email);s('f_p2cell',f.parent2_phone_cell);
        s('f_p2work',f.parent2_work_name);s('f_p2worktel',f.parent2_phone_work);
      }
    }
    const cts=await api(`/rest/v1/contacts?child_id=eq.${cid}&order=sort_order`);
    const ec=cts.filter(x=>x.contact_type==='emergency');
    const ph=cts.find(x=>x.contact_type==='physician');
    if(ec[0]){s('f_ec1name',ec[0].contact_name);s('f_ec1phone',ec[0].phone_primary);s('f_ec1rel',ec[0].relationship);s('f_ec1city',ec[0].city);s('f_ec1state',ec[0].state)}
    if(ec[1]){s('f_ec2name',ec[1].contact_name);s('f_ec2phone',ec[1].phone_primary);s('f_ec2rel',ec[1].relationship);s('f_ec2city',ec[1].city);s('f_ec2state',ec[1].state)}
    if(ph){s('f_phys',ph.contact_name);s('f_physaddr',ph.address_street);s('f_physcity',ph.city);s('f_physstate',ph.state);s('f_phystel',ph.phone_primary)}
    const [h]=await api(`/rest/v1/health_info?child_id=eq.${cid}&select=*`);
    if(h){s('f_t1',h.allergy_description);s('f_t2',h.special_condition_notes);s('f_t3',h.medication_notes);s('f_t4',h.dietary_notes);s('f_t5',h.history_notes);s('f_t6',h.additional_notes);s('f_t7',h.fears_notes);s('f_t8',h.staff_notes)}
    st('Loaded: '+c.full_name,'ok');
  }catch(e){st('Error: '+e.message,'er');console.error(e)}
}
async function save_(){
  const cid=document.getElementById('cid').value.trim();
  if(!cid){st('Enter Child ID','er');return}
  st('Saving...','in');
  try{
    const [c]=await api(`/rest/v1/children?child_id=eq.${cid}&select=child_id,family_id,center_id`);
    if(!c){st('Child not found','er');return}
    const p1=g('f_p1name').trim().split(/\s+/),p2=g('f_p2name').trim().split(/\s+/);
    const fdata={address_street:g('f_addr'),address_city:g('f_city'),address_state:g('f_state')||'OH',address_zip:g('f_zip'),phone_home:g('f_phone'),
      parent1_first_name:p1.slice(0,-1).join(' '),parent1_last_name:p1.slice(-1)[0]||'',parent1_relationship:g('f_p1rel'),parent1_phone_home:g('f_p1phone'),parent1_email:g('f_p1email'),parent1_phone_cell:g('f_p1cell'),parent1_work_name:g('f_p1work'),parent1_phone_work:g('f_p1worktel'),
      parent2_first_name:p2.slice(0,-1).join(' '),parent2_last_name:p2.slice(-1)[0]||'',parent2_relationship:g('f_p2rel'),parent2_email:g('f_p2email'),parent2_phone_cell:g('f_p2cell'),parent2_work_name:g('f_p2work'),parent2_phone_work:g('f_p2worktel')};
    if(c.family_id){await api_post(`/rest/v1/families?family_id=eq.${c.family_id}`,fdata,'PATCH')}
    else{const[nf]=await api_post('/rest/v1/families',{...fdata,family_id:'FAM-'+Date.now()});if(nf)await api_post(`/rest/v1/children?child_id=eq.${cid}`,{family_id:nf.family_id},'PATCH')}
    const hdata={child_id:cid,allergy_description:g('f_t1'),special_condition_notes:g('f_t2'),medication_notes:g('f_t3'),dietary_notes:g('f_t4'),history_notes:g('f_t5'),additional_notes:g('f_t6'),fears_notes:g('f_t7'),staff_notes:g('f_t8')};
    const[eh]=await api(`/rest/v1/health_info?child_id=eq.${cid}`);
    if(eh)await api_post(`/rest/v1/health_info?child_id=eq.${cid}`,hdata,'PATCH');
    else await api_post('/rest/v1/health_info',hdata);
    st('Saved!','ok');
  }catch(e){st('Error: '+e.message,'er');console.error(e)}
}

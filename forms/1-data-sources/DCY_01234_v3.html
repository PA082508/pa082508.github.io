    if(h){

      sc('cb_yes_spec_cond',h.has_special_condition);sc('cb_no_spec_cond',!h.has_special_condition);

      s('f_t5',h.history_notes);s('f_t6',h.additional_notes);s('f_t7',h.fears_notes);s('f_t8',h.staff_notes);

async function save_(){

  if(!cid){st('Enter Child ID','er');return}
  st('Saving...','in');
  try{
    const[c]=await api(`/rest/v1/children?child_id=eq.${cid}&select=child_id,family_id,center_id`);
    if(!c){st('Child not found','er');return}
    const p1=g('f_p1name').trim().split(/\s+/),p2=g('f_p2name').trim().split(/\s+/);
    const fd={address_street:g('f_addr'),address_city:g('f_city'),address_state:g('f_state')||'OH',address_zip:g('f_zip'),phone_home:g('f_phone'),
      parent1_first_name:p1.slice(0,-1).join(' '),parent1_last_name:p1.slice(-1)[0]||'',parent1_relationship:g('f_p1rel'),parent1_phone_home:g('f_p1phone'),parent1_email:g('f_p1email'),parent1_phone_cell:g('f_p1cell'),parent1_work_name:g('f_p1work'),parent1_phone_work:g('f_p1worktel'),
      parent2_first_name:p2.slice(0,-1).join(' '),parent2_last_name:p2.slice(-1)[0]||'',parent2_relationship:g('f_p2rel'),parent2_email:g('f_p2email'),parent2_phone_cell:g('f_p2cell'),parent2_work_name:g('f_p2work'),parent2_phone_work:g('f_p2worktel')};
    if(c.family_id)await api2(`/rest/v1/families?family_id=eq.${c.family_id}`,fd,'PATCH');
    else{const[nf]=await api2('/rest/v1/families',{...fd,family_id:'FAM-'+Date.now()});if(nf)await api2(`/rest/v1/children?child_id=eq.${cid}`,{family_id:nf.family_id},'PATCH')}
    const at=[gc('cb_food')&&'food',gc('cb_medication')&&'medication',gc('cb_environmental')&&'environmental'].filter(Boolean);
    const hd={child_id:cid,has_allergies:gc('cb_has_allergy'),allergy_types:at,allergy_description:g('f_t1'),has_special_condition:gc('cb_yes_spec_cond'),special_condition_notes:g('f_t2'),uses_medication:gc('cb_yes_medication'),medication_notes:g('f_t3'),has_dietary_restriction:gc('cb_yes_diet'),dietary_notes:g('f_t4'),history_notes:g('f_t5'),additional_notes:g('f_t6'),fears_notes:g('f_t7'),staff_notes:g('f_t8')};
    const[eh]=await api(`/rest/v1/health_info?child_id=eq.${cid}`);
    if(eh)await api2(`/rest/v1/health_info?child_id=eq.${cid}`,hd,'PATCH');
    else await api2('/rest/v1/health_info',hd);

    // Save signatures to enrollment_submissions
    const sigs = {
      parent_sig:    getSigData('f_parent_sig'),
      parent_sig2:   getSigData('f_parent_sig2'),
      guardian_sig:  getSigData('f_guardian_sig'),
      admin_sig:     getSigData('f_admin_sig'),
    };
    const sigDate = g('f_sig_date') || new Date().toISOString().split('T')[0];
    // Upsert into enrollment_submissions
    const[sub]=await api(`/rest/v1/enrollment_submissions?child_id=eq.${cid}&order=created_at.desc&limit=1`);
    if(sub) {
      await api2(`/rest/v1/enrollment_submissions?id=eq.${sub.id}`,
        {signatures: sigs, signature_date: sigDate}, 'PATCH');
    } else {
      await api2('/rest/v1/enrollment_submissions',
        {child_id: cid, signatures: sigs, signature_date: sigDate,
         center_id: (await api(`/rest/v1/children?child_id=eq.${cid}&select=center_id`))[0]?.center_id,
         submission_type: 'enrollment', status: 'pending'});
    }

    st('Saved!','ok');
  }catch(e){st('Error: '+e.message,'er');console.error(e)}
}

// ── Signature pads ────────────────────────────────────────────────
const sigPads = {};

function initSigPad(id) {
  const canvas = document.getElementById(id);
  if (!canvas || canvas.tagName !== 'CANVAS') return;
  const ctx = canvas.getContext('2d');
  ctx.strokeStyle = '#000080';
  ctx.lineWidth = 1.8;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  let drawing = false, lx, ly;

  function pos(e) {
    const r = canvas.getBoundingClientRect();
    const sx = canvas.width / r.width, sy = canvas.height / r.height;
    const src = e.touches ? e.touches[0] : e;
    return { x: (src.clientX - r.left) * sx, y: (src.clientY - r.top) * sy };
  }
  function down(e) { e.preventDefault(); drawing = true; const p = pos(e); lx = p.x; ly = p.y; ctx.beginPath(); ctx.arc(lx, ly, 0.8, 0, Math.PI*2); ctx.fill(); }
  function move(e) { e.preventDefault(); if (!drawing) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(p.x, p.y); ctx.stroke(); lx = p.x; ly = p.y; }
  function up() { drawing = false; }

  canvas.addEventListener('mousedown', down);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', up);
  canvas.addEventListener('mouseleave', up);
  canvas.addEventListener('touchstart', down, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', up);
  sigPads[id] = canvas;
}

function clearSig(id) {
  const c = document.getElementById(id);
  if (c && c.tagName === 'CANVAS') {
    c.getContext('2d').clearRect(0, 0, c.width, c.height);
  }
}

function getSigData(id) {
  const c = document.getElementById(id);
  if (!c || c.tagName !== 'CANVAS') return null;
  // Check if canvas has any drawing
  const ctx = c.getContext('2d');
  const data = ctx.getImageData(0, 0, c.width, c.height).data;
  const hasDrawing = data.some((v, i) => i % 4 === 3 && v > 0);
  return hasDrawing ? c.toDataURL('image/png') : null;
}

// Init all signature pads on load
['f_parent_sig','f_parent_sig2','f_guardian_sig','f_admin_sig'].forEach(initSigPad);

<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Play Academy — Enrolment</title>
<!-- ⭐ ЖИВОЙ ЭКРАН ИНТЕРВЬЮ. Семья приходит сюда по СВОЕЙ ссылке.
     ⛔ НИ ОДНОГО ЗАШИТОГО ЗНАЧЕНИЯ: центр, набор, дети, ответы и факт согласия приходят
     из именного токена через get_prefill. Нет токена или центра — честная страница
     «откройте по ссылке своего центра», а НЕ образец чужой семьи.
     ⚠️ Макет для показов живёт отдельно — interview-demo.html; спутать нельзя. -->
<style>
:root{--ink:#14281f;--mut:#5d6b63;--line:#d9e2dc;--green:#0f4c35;--gl:#f2f7f4;--amber:#8a4b00;--ab:#fffbeb;--al:#fde68a;--blue:#1e4d7b;--bb:#eef4fa}
*{box-sizing:border-box}
body{margin:0;background:#f6f8f6;color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.wrap{max-width:620px;margin:0 auto;padding:0 16px 60px}
.bar{background:var(--green);color:#fff;padding:11px 16px;font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;position:sticky;top:0;z-index:5}
h1{font-size:21px;margin:18px 0 6px;letter-spacing:-.01em}
h2{font-size:16px;margin:22px 0 8px;color:var(--green)}
p{margin:0 0 10px}
.sub{color:var(--mut);font-size:13px}
.card{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;margin:10px 0}
.card.g{background:var(--gl);border-color:#cfe0d5}
.card.a{background:var(--ab);border-color:var(--al)}
.card.b{background:var(--bb);border-color:#c9dcee}
.q{border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;margin:9px 0;background:#fff}
.q .lab{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:700;margin-bottom:4px}
.q input{font:inherit;font-size:14.5px;width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:#fff}
.q.filled input{background:#f6faf7;border-color:#cfe0d5}
.src{font-size:11px;color:var(--mut);margin-top:5px}
.src b{color:var(--green)}
.q.conf{border-color:var(--al);background:var(--ab)}
.pick.on{border-color:var(--green);background:var(--gl);font-weight:700}
.yn{display:flex;gap:8px}
.yn .pick{display:inline-block;width:auto;min-width:88px;text-align:center;margin:6px 0}
.pick{display:block;width:100%;text-align:left;border:1.5px solid var(--al);background:#fff;border-radius:9px;padding:9px 11px;margin:6px 0;font:inherit;font-size:13.5px;cursor:pointer}
.btn{display:block;width:100%;background:var(--green);color:#fff;border:0;border-radius:10px;padding:12px;font:inherit;font-size:15px;font-weight:700;margin-top:14px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--green);border:1.5px solid var(--green);margin-top:8px}
.prog{height:7px;border-radius:4px;background:#e6ece8;overflow:hidden;margin:12px 0 4px}
.prog i{display:block;height:100%;background:var(--green)}
.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #eef2ef;font-size:13.5px}
.row:last-child{border-bottom:0}
.st{font-size:11px;font-weight:700;white-space:nowrap}
.ok{color:#0f7a4a}.next{color:var(--green)}.wait{color:#9aa5a0}.info{color:var(--amber)}
blockquote{margin:0;padding:11px 14px;border-left:3px solid var(--green);background:#fbfcfb;font-style:italic;font-size:13.5px}
.attrib{font-size:11.5px;color:var(--mut);margin-top:6px}
.back{display:inline-block;margin:0 0 10px;padding:6px 2px;border:0;background:none;font:inherit;font-size:13.5px;color:var(--mut);cursor:pointer}
.back:hover{color:#111;text-decoration:underline}
.chip{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--gl);color:var(--green);border:1px solid #cfe0d5}
  .pblk{font-size:15px;font-weight:800;color:#0f4c35;margin:18px 0 6px;
        padding-bottom:4px;border-bottom:1.5px solid #d9e2dc}
  .pblk:first-of-type{margin-top:6px}
</style></head><body>
<div class="bar"><span id="ctr">Play Academy</span><span id="step">Before you start</span></div>
<div class="wrap"><div id="app"></div></div>

<script src="interview-engine.js"></script>
<script>
/* ⛔ ДАННЫЕ ПОКАЗА — ВЫМЫШЛЕННАЯ СЕМЬЯ. Ни одного живого имени: Fenwick, Bramble Lane. */
var SUPA_URL='https://trrmyqfpxntmgxnqkikp.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRycm15cWZweG50bWd4bnFraWtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1OTczMzMsImV4cCI6MjA5NjE3MzMzM30.b2zlijzzwPPgZqTFNrOvhgNWZpBSxmQQioErMpoX_Ko';
var Q=new URLSearchParams(location.search);
var TOKEN=Q.get('t')||'', CENTER=Q.get('center')||'', SET=Q.get('set')||Q.get('p')||'admission';
var ONLY=(Q.get('only')||'').split(',').map(function(x){return x.trim()}).filter(Boolean);
/* ⭐ ТО ЖЕ ПРАВИЛО, ЧТО НА ВИТРИНЕ: отменённая форма разворачивается в преемника.
   Преемник объявлен в реестре; здесь мы его только читаем — второго мнения о том, чем
   заменена бумага, быть не может. Применяется после загрузки реестра (см. ниже). */
function succForm(k){
  var seen={}, cur=k;
  while (REG && REG.forms && REG.forms[cur] && REG.forms[cur].supersededBy && !seen[cur]) {
    seen[cur]=1; cur=REG.forms[cur].supersededBy;
  }
  return cur;
}
/* Версия словаря — обязана совпадать с полем `version` в самом словаре. */
var DICT_V='2026-08-26d';
var DICT=null, REG=null, PLAN=null, FAMILY=null, STEP=0, ROUND=0, SUBS=[];
/* Строки лекарств по ребёнку. Ветвящегося «принимает ли» нет — поля открыты. */
var MEDS={};
/* Третий ответ: «указания врача на подписанной бумаге, я принесу». По ребёнку. */
var PROMISE={}, PROMISE_NAME={};

function rpc(fn, body){
  return fetch(SUPA_URL+'/rest/v1/rpc/'+fn,{method:'POST',
    headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json','Content-Profile':'menumaker'},
    body:JSON.stringify(body)}).then(function(r){ return r.ok? r.json() : null }).catch(function(){ return null });
}

/* ⛔ БЕЗ ТОКЕНА ЭКРАН НЕ ГАДАЕТ. Нет именной ссылки — нет семьи; показать «образец»
   значило бы показать чужих детей. Говорим прямо и предлагаем то, что человек может
   сделать: открыть ссылку своего центра. */
function needLink(why){
  document.getElementById('step').textContent='';
  document.getElementById('app').innerHTML=
    '<h1>Open this from your center\u2019s link</h1>'
    +'<p>This page fills your forms in from what your family has already signed, so it needs '
    +'the personal link your center sent you \u2014 by e-mail or as a QR code.</p>'
    +'<div class="card a"><b>What to do</b><p class="sub" style="margin:4px 0 0">Open the link '
    +'from your center\u2019s message, or ask the center for a current one.</p></div>'
    +(why?'<p class="sub">'+esc(why)+'</p>':'');
}

/* ⭐ СОСТАВ СЕМЬИ — ИЗ ТОКЕНА. Ребёнок ссылки плюс братья и сёстры по общему взрослому;
   у каждого СВОЙ токен, и префилл каждого читается его токеном. */
function loadFamily(){
  return Promise.all([ rpc('get_prefill',{p_token:TOKEN}), rpc('get_prefill_siblings',{p_token:TOKEN}) ])
    .then(function(v){
      var me=v[0], sib=Array.isArray(v[1])?v[1]:[];
      if(!me) return null;
      var kids=[{ key:TOKEN, name:me.child_name||'your child', token:TOKEN, prefill:me }];
      return Promise.all(sib.map(function(s){
        return rpc('get_prefill',{p_token:s.token}).then(function(pf){
          return { key:s.token, name:s.name||'child', token:s.token, prefill:pf||{} } })
      })).then(function(rest){
        return { me:me, children:kids.concat(rest),
                 hasConsent: (me._family && typeof me._family.has_esign_consent==='boolean')
                              ? me._family.has_esign_consent : null };
      });
    });
}

/* ⛔ ФАКТЫ РЕБЁНКА — ИЗ ЕГО ЖЕ ПОДАЧ, а не из догадок. Чего в подачах нет, то null —
   «не спрашивали», и оркестратор сам решит, что форма не добавляется, но условие названо. */
function factsOf(pf){
  var f=(pf && pf._forms && pf._forms.dcy_01234) || {};
  var yn=function(y,n){ return f[y]?true : (f[n]?false : null) };
  return { attendsSchool: f.attends_school_age ? (f.attends_school_age==='yes') : null,
           healthCondition: yn('health_y','health_n'),
           medication: null, infant: null, specialDiet: null };
}

/* ⛔ ПОДПИСЫВАЕМАЯ ФОРМА И ЛИСТ ДЛЯ ЧТЕНИЯ — РАЗНЫЕ ВЕЩИ, И ОЧЕРЕДЬ ИХ НЕ МЕШАЕТ.
   Первый живой прогон дал семье Graves «33 формы к подписи» — среди них «Building for the
   Future», «WIC Information» и «What To Bring», которые ничего не требуют, да ещё по три
   раза, по разу на ребёнка. Это не список дел, а испуг.
   ⭐ ПРИЗНАК БЕРЁМ ИЗ СЛОВАРЯ, А НЕ ИЗ НОВОГО ФЛАГА: у листа для чтения нет collect(),
   значит нет и строк словаря — он и объявлен в exemptForms. Второй признак завёл бы
   второе мнение о том же. */
var SIGNABLE={};
function isSignable(key){
  if (SIGNABLE[key]===undefined)
    SIGNABLE[key] = !!(DICT && DICT.rows && DICT.rows.some(function(r){ return r.form===key }));
  return SIGNABLE[key];
}
function slotsOfSet(){
  if (ONLY.length) return ONLY;
  var pk = REG && REG.packets && REG.packets[SET];
  if (!pk || !pk.slots) return [];
  return pk.slots.filter(function(s){ return s.section!=='if_applicable' }).map(function(s){ return s.key });
}
function baseForms(){
  return slotsOfSet().filter(function(k){ return k!=='parent_consent' && isSignable(k) });
}
/* Листы для чтения и бумаги, которые несут в центр, — отдельной секцией, ОДИН раз на семью. */
function readOnlySlots(){ return slotsOfSet().filter(function(k){ return !isSignable(k) }) }

Promise.all([
  /* ⛔ СЛОВАРЬ ТЯНУЛСЯ БЕЗ ВЕРСИИ — И ЭТО МОЛЧАЛИВАЯ ДЫРА (замер 26.08). Pages отдаёт
     `cache-control: max-age=600`: десять минут после выкладки семья могла получить НОВЫЙ
     экран со СТАРЫМ словарём. Тогда `dependsOn` нет — прятанье молча выключено; подписей
     нет — вопросы снова звучат именами наших колонок. Ничего не ломается вслух: экран
     просто работает хуже, и никто не узнаёт.
     ⭐ ТОТ ЖЕ КАНОН, ЧТО У КИТА: число рядом со ссылкой, и сторож в приложении держит его
     равным `version` самого словаря — забыть нельзя молча. */
  fetch('interview-dictionary.json?v='+DICT_V).then(function(r){return r.json()}),
  /* ⛔ РЕЕСТР ТЯНУЛСЯ ГОЛЫМ — а он и говорит, из чего состоит набор. Пришёл бы из кэша
     старым — экран собрал бы вчерашний пакет: например, со старт-формой, только что из
     наборов вынесенной. Все прочие читатели реестра на витрине давно просят его
     `?t=`+`no-store`; интервью было единственным исключением. */
  fetch('../../enroll-registry.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()})
]).then(function(v){
  DICT=v[0]; REG=v[1];
  ONLY=ONLY.map(succForm);
  /* ⭐ БЕЗ КЛЮЧА — НЕ ОТКАЗ, А ДРУГОЕ НАЧАЛО (заказ владельца 26.08). По QR со стойки
     приходит НОВАЯ семья: спрашивать её нам некого, и мы спрашиваем ЕЁ САМУ.
     ⛔ Префилла у такого прохода нет, и это норма, а не поломка: нечего было заполнять. */
  if(!TOKEN) return startAnon();
  return loadFamily().then(function(fam){
    if(!fam) return needLink('This link has expired \u2014 ask your center for a new one.');
    FAMILY=fam;
    var base=baseForms();
    if(!base.length) return needLink('This packet has no forms yet.');
    /* ⭐ ИНТЕРВЬЮ ПОЛУЧАЮТ ВСЕ НАБОРЫ (решение владельца 26.08, вариант «в»).
       ⛔ ЗДЕСЬ СТОЯЛО ПРАВИЛО «набор со старт-формой уводим прежним путём», и оно
       выбрасывало из разговора ЧЕТЫРЕ набора из пяти: младенцев, ясли-сад, школьников
       и welcome. Семья приходила к двери интервью и тут же оказывалась на старой
       странице — всё, что мы строили в интервью, видела одна семья из пяти.
       Старт-форма перестала быть слотом набора и живёт своей дверью
       (`parent-forms.html?center=…&only=start_form`), так что уводить больше некого. */
    var prefillOfMe = fam.children[0].prefill || {};
    PLAN=PAInterview.planInterview({
      dict:DICT, registry:REG, baseForms:base,
      familyFacts:{ hasEsignConsent: fam.hasConsent },
      /* ⛔ У КАЖДОГО РЕБЁНКА СВОЙ ПРЕФИЛЛ. Замер 24.08 на живой семье: один общий
         префилл ставил в бланк сестры имя брата и его дату рождения. */
      children: fam.children.map(function(c){ return { key:c.key, name:c.name, facts:factsOf(c.prefill),
        prefill:(c.prefill&&c.prefill._forms)||null } }),
      prefill: prefillOfMe._forms || {} });
    document.getElementById('ctr').textContent='Play Academy'+(CENTER?' \u00b7 '+CENTER:'');
    render();
  });
}).catch(function(e){ needLink(String(e&&e.message||e)) });

/* ⛔ ФОРМЫ НАЗЫВАЮТСЯ ЧЕЛОВЕЧЕСКИ, А НЕ КЛЮЧОМ. Находка владельца на показе: очередь
   подписания звала бумаги `parent_consent`, `dcy_01234`, `iea` — это адреса в коде, а не
   имена документов. Семья такого документа в руках не держала и в письме не видела.
   ⭐ ПОРЯДОК ИСТОЧНИКОВ ИМЕНИ: label слота пакета (то, что семья УЖЕ видит на карточке
   витрины) → title формы из реестра (каталожное, с ревизией) → ключ последним и вслух.
   Ключ остаётся, но МЕЛКИМ ВТОРИЧНЫМ текстом: он нужен нам для разговора о бумаге, а не
   родителю для её узнавания. */
var NAME_CACHE = {};
function formName(key){
  if (NAME_CACHE[key]) return NAME_CACHE[key];
  var label=null, title=null;
  try {
    var pk = REG && REG.packets ? REG.packets : {};
    for (var p in pk) {
      var slots = pk[p] && pk[p].slots;
      if (!slots) continue;
      for (var i=0;i<slots.length;i++) if (slots[i].key===key && slots[i].label) { label=slots[i].label; break }
      if (label) break;
    }
    var f = REG && REG.forms ? REG.forms[key] : null;
    if (f && f.title) title = f.title;
  } catch(_){}
  NAME_CACHE[key] = label || title || key;
  return NAME_CACHE[key];
}
/* ⚠️ Ключ показывается ТОЛЬКО когда человеческого имени нет: тогда молчать нельзя —
   бумага без имени всё равно должна быть узнаваема хоть чем-то. */
function formKeyHint(key){
  /* ⚠️ КЛЮЧ — ОТДЕЛЬНОЙ СТРОКОЙ ПОД ИМЕНЕМ, А НЕ ХВОСТОМ. Хвостом он разрывал длинные
     имена на две строки, и очередь читалась рвано: «Child Enrollment & Health (DCY» /
     «01234) · dcy_01234». Имя должно занимать строку целиком — оно здесь главное. */
  return formName(key)===key ? ''
    : '<div class="sub" style="font-size:10px;margin-top:1px">'+esc(key)+'</div>';
}
/* ⭐ ПРЕСЕТ — ПРО РЕЖИМ, А НЕ ПРО ИМЯ; но и он читается человеком. */
var PRESET_NAME = { school_transport: 'School transport' };
function presetName(p){ return PRESET_NAME[p] || p }

/* ⭐ ССЫЛКА НА НАСТОЯЩИЙ БЛАНК — СО СВОИМ ТОКЕНОМ РЕБЁНКА. Форма семьи открывается токеном
   ребёнка ссылки; детская — токеном СВОЕГО ребёнка. Один токен на всех подставил бы одну
   и ту же бумагу каждому. */
function formHref(s){
  var f=(REG&&REG.forms&&REG.forms[s.form])||{};
  var cur=f.current, url=(cur&&f.versions&&typeof f.versions[cur]==='string')?f.versions[cur]:(f.fallbackUrl||'');
  if(!url) return '#';
  var tok = s.childKey || TOKEN;
  var sep = url.indexOf('?')>=0?'&':'?';
  return url+sep+'t='+encodeURIComponent(tok)+(CENTER?'&center='+encodeURIComponent(CENTER):'')+'&k='+encodeURIComponent(s.form);
}

function el(h){ var d=document.createElement('div'); d.innerHTML=h; return d.firstElementChild }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}) }

/* ⭐ ВОПРОС С ОТВЕТОМ ПОМЕЧЕН ИСТОЧНИКОМ. Пустой — пуст. Спорный — выбор, а не наш ответ. */
/* ⭐ ПОЯСНЕНИЕ У ТОГО ЖЕ ВОПРОСА, ЧТО И НА БЛАНКЕ. Один вопрос — одно объяснение: если
   бумага говорит одно, а интервью другое, семья поверит тому, что читает последним.
   Текст здесь и в клетке 01234 держится одной строкой смысла (`child.transport_by_center`). */
var Q_HINT = {
  /* ⛔ ЗАПАСНАЯ КОПИЯ. Источник — `enroll-registry.json → help`. */
  'child.transport_by_center':
    "<b>Please tick one.</b> This is about one thing: <b>may we drive your child to a doctor or an urgent care when waiting for you would take too long?</b> “Yes” means we may; “No” means we wait for you or for the squad. <b>A real emergency does not depend on this answer:</b> we call 911 either way, a member of our staff goes with your child and stays until you arrive, and this form goes with them. <b>Either answer is fine — what does not work is leaving both boxes empty:</b> then we have no answer from you at all.",
};

/* ── ОТВЕТЫ СЕМЬИ ЗА ЭТОТ ПРОХОД ───────────────────────────────────────────────
   ⛔ ПОВОД (проба 26.08). Поля вопросов рисовались голыми `<input>` — без единого
   обработчика. Набранное рукой не попадало НИКУДА: живая проба безымянного прохода
   положила в память сидения 20 значений — все из блока самоназвания, лекарств и
   обещания, — а слово, введённое в первое же поле семейного шага, в мешке отсутствовало
   (`hasTyped:false`). То есть интервью спрашивало, а бумага уходила без ответа.
   ⭐ ОДНО МЕСТО ПАМЯТИ. Не «состояние экрана» и не второй план: экран рисуется отсюда,
   и сюда же пишет. Разойтись им негде — читатель и писатель один.
   ⛔ ДВА ЯРУСА, ПОТОМУ ЧТО ВОПРОСЫ ДВУХ УРОВНЕЙ. Семейное спрашивается один раз и
   ложится в бумагу КАЖДОГО ребёнка; детское принадлежит своему кругу. Сложи их в один
   мешок — ответ о старшем уехал бы в бланк младшей. */
var ANSWERS = { family:{}, child:{} };
function ansBag(scope){
  return scope==='family' ? ANSWERS.family
       : (ANSWERS.child[scope] = ANSWERS.child[scope] || {});
}
function ansGet(scope, canon){ return ansBag(scope)[canon] }
function ansSet(scope, canon, v){ ansBag(scope)[canon] = v }
/* ⭐ ЖИВОЙ ОТВЕТ ГЛАВНЕЕ ПРОШЛОЙ БУМАГИ. Если семья набрала своё поверх подставленного —
   в бланк едет набранное: она сегодня, а подача была год назад. */
function ansOr(scope, canon, fallback){
  var v = ansGet(scope, canon);
  return (v===undefined) ? fallback : v;
}

/* ⛔ СЛУШАТЕЛЬ ОДИН И ВЕШАЕТСЯ ОДНАЖДЫ, НА КОРЕНЬ. Каждая перерисовка заменяет
   СОДЕРЖИМОЕ `#app`, но не сам `#app`: обработчик на поле пришлось бы вешать заново
   после каждой отрисовки, и один забытый путь отрисовки молча вернул бы дефект. */
/* Есть ли вопрос, который ждёт ответа на этот. */
function isMainQuestion(canon){
  var m=(DICT && DICT.dependsOn)||{};
  for(var k in m) if(m[k].on===canon) return true;
  return false;
}
function bindAnswers(){
  var app=document.getElementById('app'); if(!app || app.__ansBound) return;
  app.__ansBound=1;
  ['input','change'].forEach(function(ev){
    app.addEventListener(ev, function(e){
      var t=e.target; if(!t || !t.getAttribute) return;
      var c=t.getAttribute('data-canon'); if(!c) return;
      var sc = t.getAttribute('data-scope')||'family';
      ansSet(sc, c, t.type==='checkbox' ? (t.checked?'Yes':'') : t.value);
      /* ⭐ ГЛАВНЫЙ ВОПРОС ОТКРЫВАЕТ ЗАВИСИМЫЙ СРАЗУ. Перерисовываем ТОЛЬКО когда ответ
         кого-то отпирает: перерисовка на каждой букве выбивала бы курсор из поля. */
      if(ev==='change' && isMainQuestion(c)) render();
    }, true);
  });
  /* ⛔ СПОРНЫЙ ВОПРОС ТОЖЕ ОТВЕЧАЕТСЯ. Кнопки выбора между двумя записями не имели
     обработчика вовсе: семья нажимала, экран не менялся, выбор никуда не шёл. */
  app.addEventListener('click', function(e){
    var b=e.target.closest && e.target.closest('button.pick'); if(!b) return;
    var c=b.getAttribute('data-canon'); if(!c) return;
    var scope=b.getAttribute('data-scope')||'family';
    var v=b.getAttribute('data-value');
    ansSet(scope, c, v===null ? '' : v);
    render();
  }, true);
}

/* ⛔ ВОПРОС, У КОТОРОГО ЕСТЬ ГЛАВНЫЙ, НЕ ЗАДАЁТСЯ РАНЬШЕ ГЛАВНОГО. «Кто оказывает
   услуги» до ответа «получает ли услуги» — вопрос в пустоту: семья либо выдумает ответ,
   либо решит, что мы не читали её же слов строкой выше.
   ⭐ СВЯЗЬ ОБЪЯВЛЕНА В СЛОВАРЕ (`dependsOn`), а не зашита здесь: экран не место для
   суждений о смысле бланка. Сменится бумага — правится объявление, не код.
   ⚠️ ПРЯТАТЬ — НЕ ТЕРЯТЬ. Скрытый вопрос остаётся в наборе и в счёте сторожа полноты;
   он появляется в тот же миг, как главный отвечен. */
function askable(a, scope){
  var dep = (DICT && DICT.dependsOn && DICT.dependsOn[a.canonical]);
  if(!dep) return true;
  var v = ansGet(scope, dep.on);
  /* ⛔ ПРЕФИЛЛ ТОЖЕ ОТВЕТ. Если главный вопрос уже отвечен прошлой бумагой, зависимый
     обязан быть виден сразу: иначе семья, у которой всё заполнено, не увидела бы клетку,
     которую центру нужно уточнить. */
  if(v===undefined) v = mainAnswerFromPlan(a, dep.on, scope);
  return String(v==null?'':v).trim().toLowerCase() === String(dep.value).trim().toLowerCase();
}
/* Ответ на главный вопрос, каким его знает план (то есть прошлые подачи). */
function mainAnswerFromPlan(a, mainCanon, scope){
  var pools=[];
  if(PLAN && PLAN.familyQuestions) pools.push(PLAN.familyQuestions.family||[]);
  if(PLAN && PLAN.rounds) PLAN.rounds.forEach(function(r){
    if(scope==='family' || r.key===scope) pools.push(r.answers.child||[]);
  });
  for(var i=0;i<pools.length;i++){
    for(var j=0;j<pools[i].length;j++){
      if(pools[i][j].canonical===mainCanon) return pools[i][j].value;
    }
  }
  return undefined;
}

/* ⛔ `sourceFormats` ОПИСЫВАЕТ КЛЕТКУ, А НЕ ОТВЕТ. У пар «да/нет» в клетке стои́т ОТМЕТКА,
   и словарь честно зовёт её `текст`; из пяти пар булевым назван ровно один смысл. Спроси
   мы только `sourceFormats` — кнопки получил бы один вопрос из пяти, а остальные четыре
   остались бы полем ввода, где «y» молча не отвечает ни да, ни нет.
   ⭐ ВТОРОЕ ДОКАЗАТЕЛЬСТВО УЖЕ ОБЪЯВЛЕНО: есть пара в `branchFields` — значит вопрос
   имеет ровно два ответа. Это суждение бланка, не наше. */
var BOOL_CACHE = null;
function boolCanonicals(){
  if(BOOL_CACHE) return BOOL_CACHE;
  var out = {};
  var can = (DICT && DICT.canonicals) || {};
  for(var k in can){
    var sf = can[k] && can[k].sourceFormats;
    if(sf && sf.indexOf('булево')>=0) out[k]=1;
  }
  var br = (DICT && DICT.branchFields) || {};
  (DICT && DICT.rows || []).forEach(function(r){
    if(br[r.form] && Object.prototype.hasOwnProperty.call(br[r.form], r.key)) out[r.canonical]=1;
  });
  BOOL_CACHE = out;
  return out;
}

function qCard(a, scope){
  scope = scope || 'family';
  /* ⛔ ОБЛАСТЬ ПРИХОДИТ ЯВНО. `list.map(qCard)` подсунул бы вторым доводом НОМЕР
     строки — и ответы всей семьи легли бы в мешок ребёнка с ключом «0». */
  var mark = ' data-canon="'+esc(a.canonical)+'" data-scope="'+esc(scope)+'"';
  var live = ansGet(scope, a.canonical);
  /* ⛔ ЯРЛЫК НЕСЁТ ПРЕФИКС СМЫСЛА. Срезав его, экран показывал два разных вопроса под
     одним словом NAME — родителя и экстренного контакта. Одинаковая подпись под разными
     вопросами хуже длинной. */
  /* ⭐ ПОДПИСЬ ЖИВЁТ В СЛОВАРЕ, А ИМЯ КЛЮЧА — ЗАПАСНОЙ ВЫХОД (26.08). Пять вопросов
     звучали машинным «emergency1 relation other»: семья читала имя нашей колонки вместо
     вопроса. Там, где бумага вопроса не задаёт вовсе (у экстренного контакта на бланке
     только пустая строка), подпись — единственное, что объясняет, чего от неё хотят. */
  var dcan = (DICT && DICT.canonicals && DICT.canonicals[a.canonical]) || {};
  var label = dcan.label || a.canonical.replace(/[._]/g,' ');
  /* ⭐ ОДИН ИСТОЧНИК НА ВСЕ ДВЕРИ (26.08): текст живёт в `enroll-registry.json → help`,
     который читают И бланк, И интервью. Инлайн-копия ниже остаётся ЗАПАСНОЙ — на случай
     отказа сети, — и потому обязана совпадать. Прежде копий было две равноправных, и
     комментарий честно просил «меняя одно, меняй оба»; просьба не заменяет механизма. */
  var helpText = (REG && REG.help && REG.help[a.canonical]) || Q_HINT[a.canonical];
  var hint = helpText
    ? '<div class="src" style="margin-top:7px;line-height:1.5">'+helpText+'</div>' : '';
  if (a.state==='conflict'){
    /* ⛔ ОДНО ЗНАЧЕНИЕ — ОДНА КНОПКА. Семейный блок читается по записям всех детей, и
       одно и то же значение приходит из бумаги каждого: без сведения мать увидела бы три
       одинаковые кнопки и решила бы, что выбирает между тремя разными ответами.
       ⭐ Подпись называет РЕБЁНКА, чья это запись: имя бумаги семье ни о чём не говорит. */
    var byValue = [];
    a.found.forEach(function(f){
      var row = byValue.filter(function(x){ return x.value===f.value })[0];
      if(!row){ row={ value:f.value, from:[] }; byValue.push(row) }
      var who = f.who || f.form;
      if(row.from.indexOf(who)<0) row.from.push(who);
    });
    var opts = byValue.map(function(r){
      return '<button class="pick"'+mark+' data-value="'+esc(r.value)+'">'+esc(r.value)
        +' <span class="sub">— from '+esc(r.from.join(', '))+'</span></button>'}).join('');
    return '<div class="q conf"><div class="lab">'+esc(label)+'</div>'
      +'<p style="margin:0 0 6px;font-size:13.5px"><b>We have two answers on file.</b> Which one is correct today?</p>'
      +opts+'<button class="pick"'+mark+' data-value="">Neither — let me type it</button>'+hint+'</div>';
  }
  /* ⛔ ВОПРОС «ДА/НЕТ» ТЕКСТОВЫМ ПОЛЕМ — ЛОВУШКА С МОЛЧАЛИВОЙ ЦЕНОЙ. Все 12 булевых
     смыслов рисовались строкой ввода. Родитель, набравший «y» вместо «Yes», получал ОБЕ
     клетки пары пустыми: ни «да», ни «нет» — а был уверен, что ответил. Никакой ошибки
     ему при этом не показывали.
     ⭐ Формат берётся из словаря (`sourceFormats`), а не угадывается по имени смысла:
     имя `child.has_health_condition` выглядит булевым, а `child.avoid` — нет, и оба
     суждения были бы нашими, а не бланка.
     ⛔ КНОПКА НЕ ОТВЕЧАЕТ ЗА СЕМЬЮ: пока ни одна не нажата, ответа нет. Предвыбранное
     «No» было бы ответом, которого никто не давал. */
  if (boolCanonicals()[a.canonical] && a.state!=='conflict'){
    var cur = live===undefined ? String(a.value==null?'':a.value) : String(live);
    var norm = cur.trim().toLowerCase();
    var btn = function(v){
      return '<button class="pick'+(norm===v.toLowerCase()?' on':'')+'"'+mark
        +' data-value="'+v+'">'+v+'</button>'; };
    var srcLine = (a.state==='answered' && live===undefined)
      ? '<div class="src">filled in from <b>'+esc(a.found.map(function(f){return f.form}).join(', '))+'</b></div>' : '';
    return '<div class="q'+(a.state==='answered'?' filled':'')+'"><div class="lab">'+esc(label)+'</div>'
      +'<div class="yn">'+btn('Yes')+btn('No')+'</div>'+srcLine+hint+'</div>';
  }
  if (a.state==='answered'){
    return '<div class="q filled"><div class="lab">'+esc(label)+'</div>'
      +'<input'+mark+' value="'+esc(live===undefined?a.value:live)+'">'
      +'<div class="src">filled in from <b>'+esc(a.found.map(function(f){return f.form}).join(', '))+'</b></div>'
      +hint+'</div>';
  }
  /* ⛔ ПУСТОЙ ВОПРОС — ГЛАВНЫЙ АДРЕСАТ ПОЯСНЕНИЯ. Именно здесь семья и бросает клетку. */
  return '<div class="q"><div class="lab">'+esc(label)+'</div>'
    /* ⛔ ПЛАШКА «—» ЧИТАЛАСЬ КАК ОТВЕТ. Тире в клетке — это то, что человек пишет, когда
       ответа нет: семья видела заполненное поле там, где мы ждали её слова. Пустое поле
       честнее любого знака. */
    +'<input'+mark+' value="'+esc(live===undefined?'':live)+'">'+hint+'</div>';
}

/* ── БЛОК САМОНАЗВАНИЯ (STEP -1) ───────────────────────────────────────────────
   ⛔ ТО, ЧТО КЛЮЧ ПРИНОСИЛ ГОТОВЫМ, ТЕПЕРЬ СПРАШИВАЕТСЯ: кто вы · кто ребёнок · дата
   рождения. Меньше нельзя — без даты рождения ребёнок неотличим от однофамильца, и
   разбор в центре превратится в гадание.
   ⛔ И БОЛЬШЕ ТОЖЕ НЕЛЬЗЯ: адрес, телефоны и прочее спросят сами формы набора. Второй
   опрос об одном — верный способ бросить пакет на первом экране. */
var SELF = { adult:'', children:[{ name:'', dob:'' }] };
/* ⭐ ОДИН РАЗГОВОР — ОДИН ID. Проставляется всем подачам прохода, чтобы директор видел
   шесть бумаг двух детей как ОДНУ семью, а не шесть строк подряд по времени. */
var PASS_ID = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : null;

function selfReady(){
  if(!SELF.adult.trim()) return false;
  return SELF.children.length>0 && SELF.children.every(function(c){ return c.name.trim() && c.dob; });
}

function selfBlock(){
  var ready = selfReady();
  return '<div><h1>Let us start with who you are</h1>'
    +'<p class="sub">We have no forms for you yet \u2014 so nothing here is filled in for you. '
    +'Tell us these three, and the packet builds itself from there.</p>'
    +'<div class="card"><label>Your name<br><input id="sfAdult" value="'+esc(SELF.adult)+'"></label></div>'
    /* ⭐ ДЕТИ — СПИСКОМ, А НЕ ОДИН. Именной вход всегда знал братьев и сестёр
       (get_prefill_siblings); безымянный обязан уметь то же, иначе новая ветвь входа
       беднее старой по рамке — а это и есть то, чего делать нельзя. */
    +SELF.children.map(function(c,i){
      return '<div class="card"><b>Child '+(i+1)+'</b>'
        +'<label>Name<br><input class="sfName" data-i="'+i+'" value="'+esc(c.name)+'"></label>'
        +'<label>Date of birth<br><input class="sfDob" data-i="'+i+'" type="date" value="'+esc(c.dob)+'"></label>'
        +(SELF.children.length>1?'<button class="btn2 sfDel" data-i="'+i+'">Remove</button>':'')
        +'</div>'; }).join('')
    +'<button class="btn2" id="sfAdd">+ Another child in this family</button>'
    +'<button class="btn" id="sfGo"'+(ready?'':' disabled')+'>Next</button>'
    +(ready?'':'<p class="sub">All three are needed \u2014 the date of birth is what tells your child apart from another with the same name.</p>')
    +'</div>';
}

function bindSelf(){
  var a=document.getElementById('sfAdult');
  if(a) a.oninput=function(){ SELF.adult=a.value; var g=document.getElementById('sfGo'); if(g) g.disabled=!selfReady(); };
  document.querySelectorAll('.sfName').forEach(function(e){
    e.oninput=function(){ SELF.children[+e.getAttribute('data-i')].name=e.value;
      var g=document.getElementById('sfGo'); if(g) g.disabled=!selfReady(); }; });
  document.querySelectorAll('.sfDob').forEach(function(e){
    e.oninput=function(){ SELF.children[+e.getAttribute('data-i')].dob=e.value;
      var g=document.getElementById('sfGo'); if(g) g.disabled=!selfReady(); }; });
  document.querySelectorAll('.sfDel').forEach(function(e){
    e.onclick=function(){ SELF.children.splice(+e.getAttribute('data-i'),1); render(); }; });
  var add=document.getElementById('sfAdd');
  if(add) add.onclick=function(){ SELF.children.push({ name:'', dob:'' }); render(); };
  var g=document.getElementById('sfGo');
  if(g) g.onclick=function(){ if(g.disabled) return; if(buildAnonFamily()!==false){ STEP=0; render(); } };
}

/* ⛔ СЕМЬЯ СОБИРАЕТСЯ ИЗ ОТВЕТОВ, А НЕ ИЗ ПУСТОТЫ. Ключа у ребёнка нет — его роль играет
   рукотворный `anon`; подача заходом 3 разберётся, кто это, и заведёт личность. */
function buildAnonFamily(){
  /* ⛔ У КАЖДОГО РЕБЁНКА СВОЙ КЛЮЧ `anonN`: мешок ответов складывается по ключу, и один
     ключ на всех смешал бы двоих в одном бланке — прецедент Rife, только без токенов. */
  var kids = SELF.children.map(function(c,i){
    return { key:'anon'+(i+1), name:c.name, token:'',
             prefill:{ child_name:c.name, dob:c.dob, parent_name:SELF.adult, _sources:{} } }; });
  var pf = kids[0].prefill;
  FAMILY = { me:pf, children:kids,
             /* ⛔ `null`, А НЕ `false`: «не спрашивали» \u2260 «отказались». Каскад сам
                поднимет согласие первым листом \u2014 новая семья его ещё не давала. */
             hasConsent:null };
  var base = baseForms();
  /* ⛔ ПУСТОЙ НАБОР — ЕДИНСТВЕННАЯ ПРИЧИНА УВЕСТИ: спрашивать не о чем. Условие про
     старт-форму ушло вместе с её членством в наборах (владелец, 26.08). */
  if(!base.length){
    location.replace('../../parent-forms.html'+location.search); return false;
  }
  PLAN = PAInterview.planInterview({
    dict:DICT, registry:REG, baseForms:base,
    familyFacts:{ hasEsignConsent: FAMILY.hasConsent },
    children:kids.map(function(k){ return { key:k.key, name:k.name, facts:factsOf(k.prefill), prefill:null }; }),
    prefill:{} });
  document.getElementById('ctr').textContent='Play Academy'+(CENTER?' \u00b7 '+CENTER:'');
  return true;
}

function startAnon(){ STEP=-1; render(); }

/* ── ШАГ НАЗАД (В.5, заказ владельца 26.08) ────────────────────────────────────
   ⛔ ДОРОГИ НАЗАД НЕ БЫЛО ВОВСЕ. Опечатку в имени ребёнка нельзя было исправить иначе,
   как начав разговор заново — то есть потеряв всё набранное. Родитель, заметивший ошибку
   на четвёртом экране, оказывался перед выбором «оставить неверное или начать сначала».
   ⭐ ВОЗВРАТ БЕЗ ПОТЕРЬ ДЕРЖИТСЯ НЕ КНОПКОЙ, А `ANSWERS`: экран рисуется из памяти, и
   шаг назад — просто другая отрисовка той же памяти. Кнопка лишь называет дорогу.
   ⛔ КНОПКА ЖИВЁТ В ОДНОМ МЕСТЕ — в `render()`, а не в каждом блоке: «на каждом шаге»
   обязано быть свойством экрана, иначе один новый шаг молча окажется без выхода. */
function backTarget(){
  if(STEP===2 && ROUND>0) return { step:2, round:ROUND-1, name:PLAN.rounds[ROUND-1].name };
  if(STEP===2) return { step:1, name:'your family' };
  if(STEP===3) return PLAN && PLAN.rounds.length
    ? { step:2, round:PLAN.rounds.length-1, name:PLAN.rounds[PLAN.rounds.length-1].name }
    : { step:1, name:'your family' };
  if(STEP===4) return { step:3, name:'the income questions' };
  if(STEP===1) return { step:0, name:'the start' };
  /* ⛔ С ПЕРВОГО ЭКРАНА НАЗАД НЕКУДА, И ЭТО ГОВОРИТСЯ МОЛЧАНИЕМ, А НЕ МЁРТВОЙ КНОПКОЙ:
     кнопка, которая ничего не делает, читается как поломка. */
  if(STEP===0 && !TOKEN) return { step:-1, name:'who you are' };
  return null;
}
function goBack(){
  var t=backTarget(); if(!t) return;
  STEP=t.step; if(t.round!==undefined) ROUND=t.round;
  render();
  window.scrollTo(0,0);
}

function render(){
  var app=document.getElementById('app'), s=document.getElementById('step');
  bindAnswers();
  app.innerHTML='';
  var bt=backTarget();
  if(bt){
    var bb=document.createElement('button');
    bb.className='back'; bb.type='button';
    bb.textContent='\u2190 Back to '+bt.name;
    bb.onclick=goBack;
    app.appendChild(bb);
  }
  if (STEP===-1){ s.textContent='Who you are'; app.appendChild(el(selfBlock())); bindSelf(); return }
  if (STEP===0){ s.textContent='Before you start'; app.appendChild(el(stage1())); return }
  if (STEP===1){ s.textContent='About your family'; app.appendChild(el(familyBlock())); return }
  if (STEP===2){
    if(!PLAN.rounds.length){ STEP=3; return render() }
    s.textContent='About '+PLAN.rounds[ROUND].name; app.appendChild(el(childBlock())); return }
  if (STEP===3){ s.textContent='Income (IEA)'; app.appendChild(el(ieaBlock())); return }
  s.textContent='Your packet'; app.appendChild(el(stage2()));
}

function stage1(){
  var many = PLAN.formsFinal.length>1;
  var counts = PLAN.familyQuestions.counts;
  var covered = counts.answered/(counts.answered+counts.empty+counts.conflict||1);
  /* §1д: абзац показывается ТОЛЬКО когда предзаполнение реально покрывает большинство. */
  var already = covered>=0.5
    ? '<div class="card b"><b>Already with us?</b><p class="sub" style="margin:4px 0 0">Most questions will '
      +'come to you already answered — we filled them in from the forms you signed before. Just check that '
      +'everything is still correct and move on. Only the questions we have no answer for will come empty. '
      +'<b>Your signature is always fresh — we never carry it over.</b></p></div>'
    : '<div class="card b"><b>Already with us?</b><p class="sub" style="margin:4px 0 0">Some of your answers '
      +'are already filled in from the forms you signed before — check them and move on. The rest we have '
      +'not been told yet. <b>Your signature is always fresh — we never carry it over.</b></p></div>';
  return '<div><h1>Before you start</h1>'
    +'<p>'+(many
      ? 'There are <b>a number of forms</b> in this packet — but you do not fill them in by hand.'
      : 'There is <b>one form</b> here — but you do not fill it in by hand.')+'</p>'
    +'<p><b>Answer the questions first.</b> We ask you once about your family and about each child. Your '
    +'answers then fill the forms in for you. All that is left is to <b>look each one over and sign it</b>.</p>'
    +'<p class="sub">Your answers stay on this phone for <b>7 days</b>, so you can stop and come back.</p>'
    + already
    +'<div class="card"><b>More than one child?</b><p class="sub" style="margin:4px 0 0">One form per child — '
    +'twins too. You answer the family questions once; after that we ask only about the next child.<br><br>'
    +'Every form is one per child — <b>with one exception</b>: the Income Eligibility Application (IEA) is '
    +'<b>one per family</b>. It comes last; list all your children on it.</p></div>'
    +'<p class="sub" style="text-decoration:underline">Read more ▾</p>'
    +'<button class="btn" onclick="STEP=1;render()">Start</button></div>';
}

/* ── БЛОКИ ПО ЧЕЛОВЕКУ (заказ владельца 26.08) ─────────────────────────────────
   ⛔ ПЛОСКИЙ СПИСОК СЕМЕЙНЫХ ВОПРОСОВ ЧИТАЕТСЯ КАК АНКЕТА, А НЕ КАК РАЗГОВОР. Мать
   отвечала про телефон отца между вопросом об адресе и вопросом об экстренном контакте:
   поля одного человека были разбросаны, и заполнять их приходилось прыжками.
   ⭐ ГРУППИРОВКА ВЫВОДИТСЯ ИЗ КЛЮЧЕЙ, а не расписывается руками: каноникалы уже несут
   `parent1.*`, `parent2.*`, `ec1.*`, `ec2.*`. Новый человек в словаре получит свой блок
   сам — списка имён в коде нет и не будет (класс «список протухнет»).
   ⛔ ВНУТРИ БЛОКА — ПОРЯДОК БЛАНКА. Сортировка «вопросы с пояснением наверх» (24.08)
   внутри блоков НЕ применяется: порядок бумаги главнее нашей заботы о пояснении. */
var PERSON_BLOCKS = [
  { pfx:'parent1.',    title:'Parent 1' },
  { pfx:'parent2.',    title:'Parent 2' },
  { pfx:'emergency1.', title:'Emergency contact 1' },
  { pfx:'emergency2.', title:'Emergency contact 2' },
];

/* ⭐ ПОРЯДОК БЛАНКА ЖИВЁТ В КОНФИГЕ БЛАНКА, СЛОВАРЬ ЕГО ЛИШЬ НЕСЁТ (канон 26.08).
   `ord` собирается генератором `interviewFieldOrder.mjs`: у накладных бланков — страница,
   сверху вниз, слева направо; у обычных — порядок разметки. Сменился бланк — перегенерация,
   а не правка рукой: рука однажды разойдётся с бумагой молча.
   ⛔ ПРЕЖНИЙ СПИСОК `FIELD_ORDER` СНЕСЁН: два источника правды об одном порядке — это
   спор, в котором правой не будет ни одна сторона.
   ⚠️ Чего на бумаге нет (экранные вопросы, циклы), тому `ord` в хвост — выдумывать им
   место на листе нельзя. */
/* ⛔ ЕСТЬ ВОПРОСЫ, У КОТОРЫХ МЕСТА НА БУМАГЕ НЕТ, А МЕСТО В РАЗГОВОРЕ ЕСТЬ. Школьный
   вопрос живёт во врезке `fk-print-hidden` — координат у неё нет, и генератор порядка
   честно отправил бы его в хвост, ЗА ПОДПИСЬ. `ordAfter` ставит такой вопрос рядом с
   родным по смыслу; это объявление человека, и генератор его не трогает.
   ⛔ ШАГ МЕЛКИЙ И УБЫВАЮЩИЙ: два вопроса, объявленные после одного якоря, не сольются,
   а цепочка «после того, что после того» сохранит порядок. */
function fieldRank(canonical, depth){
  var c = DICT && DICT.canonicals && DICT.canonicals[canonical];
  if(!c) return 9999;
  if(typeof c.ord === 'number') return c.ord;
  if(c.ordAfter && (depth||0) < 8) return fieldRank(c.ordAfter, (depth||0)+1) + 0.5/((depth||0)+1);
  return 9999;
}

function personBlocks(list){
  var used = {}, out = [];
  PERSON_BLOCKS.forEach(function(b){
    var mine = list.filter(function(a){ return a.canonical.indexOf(b.pfx)===0 });
    if(!mine.length) return;
    mine.sort(function(x,y){
      var d = fieldRank(x.canonical) - fieldRank(y.canonical);
      return d || x.canonical.localeCompare(y.canonical);
    });
    mine.forEach(function(a){ used[a.canonical]=1 });
    out.push({ title:b.title, items:mine });
  });
  /* ⛔ ОСТАЛЬНОЕ НЕ ТЕРЯЕТСЯ И НЕ ПРЯЧЕТСЯ: адрес дома, доверенные на забор и прочее
     семейное идут последним блоком — потерять вопрос страшнее, чем показать его не в
     самой красивой группе. Сторож полноты числом это же и стережёт. */
  var rest = list.filter(function(a){ return !used[a.canonical] });
  if(rest.length) out.push({ title:'The rest about your family', items:rest });
  return out;
}

function familyBlock(){
  var q=PLAN.familyQuestions, c=q.counts, tot=c.answered+c.empty+c.conflict;
  var body=personBlocks(q.family).map(function(b){
    return '<h2 class="pblk">'+esc(b.title)+'</h2>'
      +b.items.filter(function(a){ return askable(a,'family') })
             .map(function(a){ return qCard(a,'family') }).join('');
  }).join('');
  return '<div><div class="prog"><i style="width:20%"></i></div>'
    +'<h1>About your family</h1><p class="sub">Asked once — it carries to every child.</p>'
    /* ⛔ «0 ALREADY ANSWERED · 0 TO CONFIRM · 51 NEW» — ТРИ ЧИСЛА, ИЗ КОТОРЫХ ДВА НОЛЬ.
       Новой семье (а по QR со стойки приходит именно она) плашка сообщала только то,
       сколько работы впереди, и делала это трижды. Считать нечего — говорить нечего.
       ⭐ Числа остаются там, где они правда: у семьи с прошлыми бумагами «уже заполнено»
       и «подтвердить» — настоящая новость, и она показывается. */
    +(c.answered||c.conflict
      ? '<p class="sub">'
        +(c.answered? '<span class="chip">'+c.answered+' already filled in from your forms</span> ':'')
        +(c.conflict? '<span class="chip">'+c.conflict+' to confirm</span>':'')+'</p>'
      : '')
    +body
    +(PLAN.rounds.length
      ? '<button class="btn" onclick="STEP=2;ROUND=0;render()">Next — about '+esc(PLAN.rounds[0].name)+'</button>'
      : '<button class="btn" onclick="STEP=3;render()">Next — income form</button>')+'</div>';
}

/* ⛔ КРУГИ ИДУТ ПО ВСЕМ ДЕТЯМ, А НЕ ПО ДВУМ. Макет знал ровно двоих и жёстко звал
   ROUND=1 — на семье Graves (трое) он застревал на втором ребёнке, на семье из одного
   падал вовсе. Живому экрану про число детей ничего знать нельзя: их называет токен. */
/**
 * Пересобрать план текущими ответами семьи.
 *
 * ⛔ СОСТАВ ЗАВИСИТ ОТ ТОГО, ЧТО СЕМЬЯ СКАЗАЛА ТОЛЬКО ЧТО, А НЕ ТОЛЬКО ОТ СТАРЫХ БУМАГ.
 * План считался один раз при загрузке — назвав лекарство, мать не увидела бы разрешения
 * на него в очереди.
 */
function replan(){
  PLAN=PAInterview.planInterview({
    dict:DICT, registry:REG, baseForms:baseForms(),
    familyFacts:{ hasEsignConsent: FAMILY.hasConsent },
    children: FAMILY.children.map(function(c){
      return { key:c.key, name:c.name, facts:factsOf(c.prefill),
               prefill:(c.prefill&&c.prefill._forms)||null,
               meds: MEDS[c.key] };
    }),
    prefill:(FAMILY.children[0].prefill||{})._forms||{} });
}

/* ── МИНИ-БЛОК ЛЕКАРСТВ ────────────────────────────────────────────────────────
   ⭐ СПРАШИВАЕМ ОДИН РАЗ, КЛАДЁМ В ДВЕ БУМАГИ. Название и доза нужны и плану ухода, и
   разрешению на приём: спросив дважды, мы получили бы два ответа, которые однажды
   разойдутся. Цикл — та же механика, что у детей и жильцов в IEA.
   ⛔ ОДНО ЛЕКАРСТВО — ОДНА СТРОКА: два препарата в одной строке дают бумагу, по которой
   нельзя дать ни один из них. */
function medRow(kid, i){
  var m=(MEDS[kid]||[])[i]||{};
  var f=function(name,label,ph){
    return '<div class="q" style="margin:6px 0"><div class="lab">'+label+'</div>'
      +'<input value="'+esc(m[name]||'')+'" placeholder="'+ph+'" '
      +'oninput="medSet(\''+kid+'\','+i+',\''+name+'\',this.value)"></div>';
  };
  return '<div class="card" style="background:#fff">'
    +'<div class="lab" style="margin-bottom:2px">Medicine '+(i+1)+'</div>'
    + f('name','Name','Ibuprofen')
    + f('dosage','Dose','5 ml')
    + f('time','When to give it','8am and 4pm — or “only if fever”')
    + (m.from? '<div class="src">filled in from <b>'+esc(m.from)+'</b> \u2014 change it if it has</div>' : '')
    + '<div class="q" style="margin:6px 0"><div class="lab">Photo of the pharmacy label</div>'
    + '<input type="file" accept="image/*" onchange="medPhoto(\''+kid+'\','+i+',this)">'
    + '<div class="src">'+(m.photo?'<b>\u2713 label added</b>'
        :'With the label we need no separate note from the doctor \u2014 you can also add it later.')
    + '</div></div>'
    + (MEDS[kid].length>1 ? '<button class="pick" onclick="medDrop(\''+kid+'\','+i+')">Remove this medicine</button>' : '')
    + '</div>';
}
/* ⛔ ВЕТВЯЩЕГОСЯ ВОПРОСА «ПРИНИМАЕТ ЛИ?» ЗДЕСЬ НЕТ (упрощение владельца 24.08). Поля
   стоят ОТКРЫТЫМИ: семья заполняет, если есть, и оставляет пустыми, если нет. Пустое —
   законный ответ: ни замка обязательности, ни строки в счётчике оставшихся вопросов.
   ⭐ ДОВОД ОБ ОБЪЁМЕ. Ступень 1 обещает дословно: «Your answers then fill the forms in
   for you. All that is left is to look each one over and sign it». Значит спросить надо
   всё, без чего бумага не станет «only look over and sign», — пустая таблица лекарств на
   плане ухода у семьи, которая лекарства даёт, это нарушение обещания первого экрана. */
/* ⭐ УХОД СПРАШИВАЕТСЯ ЗДЕСЬ ЖЕ, А НЕ В «42 MORE QUESTIONS». Это те самые клетки, без
   которых план ухода не станет «only look over and sign»: что за состояние, как выглядит
   приступ, что делать и чего избегать. Похороненные в общем хвосте, они остались бы
   пустыми — и бумага о здоровье ребёнка ушла бы в центр ни о чём. */
var CARE_Q=['child.has_health_condition','child.health_signs','child.care_instructions','child.avoid'];
function careCards(r){
  return r.answers.child.filter(function(a){ return CARE_Q.indexOf(a.canonical)>=0 }).map(qCard).join('');
}
function medBlock(kid, r){
  var rows=(MEDS[kid]||[]).map(function(_,i){ return medRow(kid,i) }).join('');
  return '<div class="card b"><b>Medicines and care for '+esc(kidName(kid))+'</b>'
    +'<p class="sub" style="margin:6px 0 0">Fill these in if they apply. '
    +'Leave them empty if they do not \u2014 nothing here is required.</p></div>'
    + careCards(r)
    + rows
    +'<button class="btn ghost" onclick="medAdd(\''+kid+'\')">+ Add another medicine</button>'
    /* ⭐ ТРЕТИЙ ОТВЕТ. Рецепт часто выписан на бланке врача, и семья несёт его на стойку —
       это честный ответ, а не уклонение. Стои́т ПОСЛЕ таблицы: сперва предлагаем сказать
       словами, и лишь потом — «бумага у меня на руках».
       ⛔ ОБЕЩАНИЕ НЕ ЕСТЬ РАЗРЕШЕНИЕ, и родителю сказано это прямо. */
    +'<div class="card a" style="margin-top:10px">'
    +'<label style="display:flex;gap:9px;align-items:flex-start;font-size:13.5px;cursor:pointer">'
    +'<input type="checkbox" style="margin-top:3px"'+((PROMISE[kid])?' checked':'')
      +' onchange="medPromise(\''+kid+'\',this.checked)">'
    +'<span><b>The doctor\u2019s orders are on a signed paper \u2014 I will hand it to the director.</b>'
    +'<div class="src" style="margin-top:4px">Nothing can be given until that paper reaches us \u2014 '
    +'bring it in and we will enter it the same day.</div></span></label>'
    +((PROMISE[kid])
      ? '<div class="q" style="margin:9px 0 0"><div class="lab">Name of the medicine, if you remember</div>'
        +'<input value="'+esc(PROMISE_NAME[kid]||'')+'" placeholder="optional"'
        +' oninput="medPromiseName(\''+kid+'\',this.value)"></div>'
      : '')
    +'</div>';
}
function kidName(kid){
  var c=FAMILY.children.filter(function(x){return x.key===kid})[0]; return (c&&c.name)||'this child';
}
/* Открыть поля ребёнку: прошлый план ухода предзаполняет их, правимо и с источником. */
function medInit(kid){
  if(MEDS[kid]) return;
  var c=FAMILY.children.filter(function(x){return x.key===kid})[0];
  var prev=PAInterview.medsFromForms((c&&c.prefill&&c.prefill._forms)||null);
  MEDS[kid]= prev.length ? prev.map(function(m){ m.from='your care plan on file'; return m })
                         : [{name:'',dosage:'',time:''}];
}
function medPromise(kid,v){ PROMISE[kid]=v; if(!v) PROMISE_NAME[kid]=''; replan(); render() }
function medPromiseName(kid,v){ PROMISE_NAME[kid]=v; }
function medAdd(kid){ (MEDS[kid]=MEDS[kid]||[]).push({name:'',dosage:'',time:''}); replan(); render() }
function medDrop(kid,i){ MEDS[kid].splice(i,1); if(!MEDS[kid].length) MEDS[kid]=[{name:'',dosage:'',time:''}]; replan(); render() }
function medSet(kid,i,k,v){
  MEDS[kid][i][k]=v;
  /* ⛔ ПЕРЕРИСОВКА НА КАЖДОЙ БУКВЕ ВЫБИВАЛА БЫ КУРСОР. План пересобираем, экран — нет:
     состав зависит от того, названо ли лекарство, а это видно и без перерисовки. */
  replan();
}
function medPhoto(kid,i,el){
  var f=el.files&&el.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){ MEDS[kid][i].photo=String(rd.result); replan(); render() };
  rd.readAsDataURL(f);
}

function childBlock(){
  var r=PLAN.rounds[ROUND];
  var others=PLAN.rounds.filter(function(x,k){ return k!==ROUND }).map(function(x){ return x.name });
  var added=r.addedForms.length? '<div class="card a"><b>Because of your answers, we add:</b> '
      +r.addedForms.map(function(k){return esc(formName(k))}).join(', ')+'</div>' : '';
  /* ⛔ ПОДНЯТОЕ В БЛОК ИЗ ОБЩЕГО СПИСКА УХОДИТ: один вопрос — один раз. */
  var inBlock = factsOf((FAMILY.children.filter(function(c){return c.key===r.key})[0]||{}).prefill).healthCondition===true;
  var rest = r.answers.child.filter(function(a){ return !(inBlock && CARE_Q.indexOf(a.canonical)>=0) });
  /* ⛔ СВЁРНУТЫЙ ВОПРОС — ВОПРОС, НА КОТОРЫЙ НЕЛЬЗЯ ОТВЕТИТЬ. Круг показывал первые шесть,
     остальные прятал строкой «… N more questions» БЕЗ СПОСОБА ЕЁ РАСКРЫТЬ: замер 26.08 —
     19 задаваемых вопросов, из них 13 заперто. Это не «длинный экран покороче», а тринадцать
     клеток, которые уедут в бумагу пустыми, и никто не узнает почему.
     ⭐ РЕШЕНИЕ ВЛАДЕЛЬЦА 26.08: показывать ВСЕ, раскрывашку не строить. Лишнее действие
     стоит дороже прокрутки ровно там, где семья уже устала.
     ⛔ И СОРТИРОВКА ПО ПОЯСНЕНИЮ УХОДИТ ВМЕСТЕ СО СВЁРТКОЙ. Она поднимала вопрос с
     объяснением наверх, чтобы он не попал в запертый хвост; хвоста нет — а порядок бумаги
     она ломала, и он живёт в конфиге бланка (`ord`), не в наших предпочтениях. */
  rest = rest.filter(function(a){ return askable(a, r.key) })
             .sort(function(a,b){
               var d = fieldRank(a.canonical) - fieldRank(b.canonical);
               return d || a.canonical.localeCompare(b.canonical);
             });
  var body=rest.map(function(a){ return qCard(a, r.key) }).join('');
  /* ⭐ БЛОК ОТКРЫВАЕТСЯ ПО ОТВЕТУ О ЗДОРОВЬЕ — как решено владельцем 24.08. */
  var kid=FAMILY.children.filter(function(c){return c.key===r.key})[0]||{};
  var meds='';
  if(factsOf(kid.prefill).healthCondition===true){ medInit(r.key); meds=medBlock(r.key, r) }
  var last = ROUND+1>=PLAN.rounds.length;
  var next = last
    ? '<button class="btn" onclick="STEP=3;render()">Next — income form</button>'
    : '<button class="btn" onclick="ROUND='+(ROUND+1)+';render()">Next — about '
      +esc(PLAN.rounds[ROUND+1].name)+'</button>';
  var pct = 40 + Math.round((ROUND+1)/(PLAN.rounds.length+1)*40);
  return '<div><div class="prog"><i style="width:'+pct+'%"></i></div>'
    +'<h1>About '+esc(r.name)+'</h1>'
    +'<p class="sub">Only this child.'
    +(others.length? ' Nothing here carries to '+esc(others.join(' or '))+'.' : '')+'</p>'
    + added + body + meds
    + next+'</div>';
}

function ieaBlock(){
  return '<div><div class="prog"><i style="width:85%"></i></div>'
    +'<h1>Before the income questions</h1>'
    +'<p class="sub">This is the letter the state sends with the form. We show it as written.</p>'
    +'<blockquote>“Dear Parent or Guardian:<br><br>Please help us comply with the requirements of the '
    +'U.S. Department of Agriculture’s Child and Adult Care Food Program (CACFP) by completing the attached '
    +'income eligibility application for free and reduced-price meals. All information will be treated with '
    +'strict confidentiality. The CACFP provides reimbursement to the child care center for healthy meals and '
    +'snacks served to children enrolled in child care. The completion of the income eligibility application '
    +'is optional.”</blockquote>'
    +'<div class="attrib">— Ohio CACFP Income Eligibility Application, FY 2026–2027 — Household Letter</div>'
    +'<p class="sub" style="text-decoration:underline;margin-top:8px">Read the full letter ▾</p>'
    +'<div class="card g"><b>Does your household receive any of these?</b>'
    +'<div class="row"><span>☑ Food Assistance (SNAP)</span><span class="st ok">case 1234567</span></div>'
    +'<div class="row"><span>☐ Ohio Works First (OWF)</span><span></span></div>'
    +'<div class="row"><span>☐ Neither of these</span><span></span></div></div>'
    +'<div class="card b"><b>You are done with income.</b><p class="sub" style="margin:4px 0 0">With a case '
    +'number we do not ask what you earn. Parts 1, 2 and 4 only.</p></div>'
    +'<button class="btn" onclick="STEP=4;render()">Next — your packet</button></div>';
}

/* ⛔ ВТОРОЙ РЕАЛИЗАЦИИ ПРАВИЛА ЗДЕСЬ НЕТ. Пара «ключ формы ↔ тип подачи», счёт новых
   ответов и три состояния строки живут в движке (src/lib/interviewQueue.ts) и приходят
   сюда собранным артефактом. Витрина только зовёт — и потому проверяется теми же
   тестами, что и приложение: два мнения о том, подписана ли бумага, однажды разойдутся
   молча, а цена расхождения — подпись под формой, которую семья уже подписала, или
   тихая галочка над формой, которую она не подписывала. */
function childOfSub(s){
  return FAMILY.children.filter(function(c){ return c.key===(s.childKey||FAMILY.children[0].key) })[0];
}
function formsOfChild(s){ var k=childOfSub(s); return (k&&k.prefill&&k.prefill._forms)||{} }
function acceptedBag(kid, formKey){
  return PAInterview.acceptedBag((kid&&kid.prefill&&kid.prefill._forms)||{}, REG, formKey);
}
function newAnswers(s){
  var bag=PAInterview.acceptedBag(formsOfChild(s), REG, s.form);
  return bag ? PAInterview.newAnswers(DICT, s.form, s.formData||{}, bag) : [];
}

/* ⭐ ФОРМУЛИРОВКА СОСТОЯНИЯ — В ОДНОМ МЕСТЕ. Три места рисовали строку очереди, и
   разойтись им ничего не мешало: семья прочла бы о той же бумаге два разных слова. */
function stateBits(st){
  return st==='signed'  ? { mark:'\u2713', cls:'ok',   text:'Signed' }
       : st==='updated' ? { mark:'\u21bb', cls:'info', text:'New answers \u2014 tap to re-sign' }
       : st==='updated-next' ? { mark:'\u21bb', cls:'info', text:'Next \u2014 new answers, tap to re-sign' }
       : st==='next'    ? { mark:'\u2192', cls:'next', text:'Next \u2014 tap to review and sign' }
       :                  { mark:'\u00b7', cls:'wait', text:'Waiting' };
}
function stage2(){
  var subs=PAInterview.planSubmissions(PLAN,{centerCode:CENTER,presets:{dcy_01225:'school_transport'}});
  SUBS=subs;
  /* ⛔ ОТВЕТЫ ИНТЕРВЬЮ КЛАДУТСЯ В ПАМЯТЬ СИДЕНИЯ, А НЕ В АДРЕС ССЫЛКИ. Адрес виден в
     истории браузера и в плече пересылки; ответы семьи туда не отправляются. Кит читает
     их тем же кодом, что и прежние подачи (v38). */
  /* ⛔ МЕШОК ОТВЕТОВ — ПО РЕБЁНКУ, А НЕ ПО ФОРМЕ. Складывая по ключу формы, экран
     смешивал троих детей в одном `dcy_01234`: побеждал последний круг, и бланк старшего
     открывался с именем младшей. Ребёнка называет ТОКЕН его строки — по нему и кладём,
     по нему же кит и читает (KIT 39). Формы уровня семьи кладутся токеном ребёнка
     ссылки: их бланк и открывается им. */
  try {
    var bagByChild={};
    /* ⭐ ОТВЕТЫ ЭТОГО ПРОХОДА ЛОЖАТСЯ ПОВЕРХ ПРЕФИЛЛА (26.08). Живое слово семьи старше
       прошлой подачи: мать, исправившая телефон на экране, обязана увидеть исправленный
       в бланке — иначе исправление было представлением, а не правкой.
       ⛔ ИМЯ КЛЕТКИ БЕРЁТСЯ ИЗ СЛОВАРЯ, А НЕ ИЗ ГОЛОВЫ: у каноникала `child.dob` шесть
       разных имён по бланкам. Записать своё — положить ответ мимо клетки.
       ⛔ ДЕТСКОЕ БЬЁТ СЕМЕЙНОЕ, А НЕ НАОБОРОТ: круг ребёнка — разговор про ЭТОГО
       ребёнка, и сказанное в нём точнее общего ответа семьи. */
    subs.forEach(function(s){
      var mine = (s.childKey && ANSWERS.child[s.childKey]) || {};
      var br = (DICT.branchFields||{})[s.form] || {};
      (DICT.rows||[]).forEach(function(r){
        var v = mine[r.canonical];
        if(v===undefined) v = ANSWERS.family[r.canonical];
        if(r.form!==s.form || v===undefined || v==='') return;
        s.formData = s.formData || {};
        /* ⛔ ПАРА «ДА/НЕТ» — ДВЕ КЛЕТКИ ОДНОГО СМЫСЛА, И ОТМЕЧАЕТСЯ РОВНО ОДНА.
           Первая редакция разноса (26.08) писала ответ в ОБЕ: `health_y` и `health_n`
           получали одно слово, и бланк за подписью родителя утверждал, что состояние
           здоровья у ребёнка и есть, и нет. Правило то же, что в движке, и берётся из
           словаря (`branchFields` · `branchOnValue`), а не выдумывается здесь.
           ⭐ В клетку кладётся ОТМЕТКА, а не ответ: `health_n` значит «отмечено НЕТ»,
           и слово «No» в ней — не то же самое, что галочка.
           ⭐ Невыбранная гасится ЯВНО пустым: молчание оставило бы там прежнюю галочку
           прошлой подачи, и сегодняшний ответ не отменил бы вчерашний. */
        if(Object.prototype.hasOwnProperty.call(br, r.key)){
          var on = String(v).trim().toLowerCase() === String(br[r.key]).trim().toLowerCase();
          s.formData[r.key] = on ? (DICT.branchOnValue || v) : '';
          return;
        }
        s.formData[r.key] = v;
      });
    });
    /* ⛔ ОБЕЩАНИЕ КЛАДЁТСЯ РЯДОМ С ФОРМОЙ, А НЕ В ЕЁ ТАБЛИЦУ. Таблица стр. 2 под подписью
       родителя и врача — это и есть разрешение; препарат, которого никто не разрешал, в
       ней выглядел бы разрешённым. Скрытые поля бланка забирают ответ в подачу. */
    subs.forEach(function(s){
      if(s.form==='dcy_01236' && s.childKey && PROMISE[s.childKey]){
        s.formData = s.formData || {};
        s.formData.medication_paper_promised = 'true';
        if(PROMISE_NAME[s.childKey]) s.formData.promised_medication_name = PROMISE_NAME[s.childKey];
      }
    });
    /* ⭐ БЕЗЫМЯННЫЙ ПРОХОД КЛАДЁТ САМОНАЗВАНИЕ В САМИ ПОДАЧИ (26.08). Ответы блока
       «кто вы · кто ребёнок · дата рождения» живут в памяти интервью, а разбору в Inbox
       нужны В ПОДАЧЕ: без имени и даты рождения привязывать не к чему, и подача ляжет
       мёртвым грузом к тем 87, что уже ждут человека.
       ⛔ КЛЮЧ КАЖДОЙ ФОРМЫ БЕРЁТСЯ ИЗ СЛОВАРЯ, А НЕ ИЗ ГОЛОВЫ: у одного каноникала
       `child.dob` шесть разных имён по формам (`dob`, `date_of_birth`, `birthdate`…).
       Записать своё — значит положить ответ мимо клетки, и форма откроется пустой. */
    if(!TOKEN){
      var byKey={}; FAMILY.children.forEach(function(c){ byKey[c.key]=c; });
      subs.forEach(function(s){
        var mine=byKey[s.childKey]||FAMILY.children[0];
        var CANON={ 'child.name':mine.name, 'child.dob':mine.prefill.dob, 'parent1.name':SELF.adult };
        (DICT.rows||[]).forEach(function(r){
          if(r.form!==s.form) return;
          var v=CANON[r.canonical];
          if(v===undefined || v==='') return;
          s.formData = s.formData || {};
          /* ⛔ НЕ ЗАТИРАЕМ ОТВЕЧЕННОЕ: если семья уже назвала это в интервью, её слово
             старше нашего самоназвания. */
          if(s.formData[r.key]===undefined || s.formData[r.key]==='') s.formData[r.key]=v;
        });
      });
    }

    subs.forEach(function(s){
      var tok=s.childKey||FAMILY.children[0].key;
      (bagByChild[tok]=bagByChild[tok]||{})[s.form]=
        Object.assign(bagByChild[tok][s.form]||{}, s.formData||{});
    });
    sessionStorage.setItem('pa_interview_answers', JSON.stringify(bagByChild));
    /* ⭐ ОДИН РАЗГОВОР — ОДИН ID НА ВСЕ БУМАГИ ПАКЕТА. Кит подставит его в подачу, база
       поднимет в колонку: директор увидит шесть бумаг двух детей ОДНОЙ семьёй, а не
       шестью строками подряд по времени. */
    if(PASS_ID) sessionStorage.setItem('pa_interview_pass', PASS_ID);
  } catch(_){}
  var byChild={};
  subs.forEach(function(s){ (byChild[s.childKey||'__family']=byChild[s.childKey||'__family']||[]).push(s) });
  var n=subs.length;
  /* ⛔ «ПОДПИСАНО» СЧИТАЕТСЯ ИЗ ЗАПИСЕЙ ЦЕНТРА, А НЕ ИЗ ПАМЯТИ ТЕЛЕФОНА (канон 23.08):
     мать, вернувшаяся с планшета, увидела бы «0 of N» и подписала бы всё второй раз.
     Прежние принятые подачи приходят в `_forms` — по ним и считаем. */
  /* ⛔ ГАЛОЧКА СТАВИТСЯ ПО ФАКТУ, А НЕ ПО ПОРЯДКУ. Первая редакция помечала «Signed»
     первые N строк подряд — то есть говорила семье, что подписаны бумаги, которых она не
     подписывала. Считаем по КАЖДОЙ строке: есть ли принятая подача этого типа у ЭТОГО
     ребёнка. */
  function isSigned(s){ return !!PAInterview.acceptedBag(formsOfChild(s), REG, s.form) }
  /* ⭐ Тот же вычислитель отдаём наружу: репетиция обязана мерить ровно то, что рисует
     экран, а не свою копию правила. */
  window.stateOf = stateOf;
  /* ⭐ ТРИ СОСТОЯНИЯ, А НЕ ДВА. Подписана и добавить нечего — Signed. Подписана, но
     интервью собрало новые ответы — Updated, и она СЧИТАЕТСЯ НЕПОДПИСАННОЙ: форма
     изменилась, значит подпись нужна свежая (канон). Не подписана — Next/Waiting. */
  function instancesOf(s){
    return subs.filter(function(x){ return x.form===s.form && x.childKey===s.childKey }).length;
  }
  function stateOf(s){
    return PAInterview.rowState({ dict:DICT, registry:REG, formKey:s.form,
      formData:s.formData||{}, childForms:formsOfChild(s), instanceCount:instancesOf(s) });
  }
  var signed=subs.filter(function(s){ return stateOf(s)==='signed' }).length;
  var updated=subs.filter(function(s){ return stateOf(s)==='updated' }).length;
  /* ⛔ «СЛЕДУЮЩАЯ» — ТА, ЧТО НЕ ПОДПИСАНА ВОВСЕ, А НЕ ПРОСТО ПЕРВАЯ НЕЗАКРЫТАЯ. Иначе
     очередь ставила стрелку на исправление уже подписанной бумаги, а НИКОГДА не
     подписанный план ухода получал «Waiting» — и выглядел делом, которое подождёт. */
  var nextKey=(subs.filter(function(s){return stateOf(s)==='todo'})[0]
            || subs.filter(function(s){return stateOf(s)==='updated'})[0] || {});
  var html='<div><h1>Your packet</h1><p><b>'+n+' forms to sign.</b></p>'
    +'<p class="sub">Everything is filled in from your answers. Look each one over and sign it — you can '
    +'stop and come back.</p><div class="prog"><i style="width:'+Math.round(signed/n*100)+'%"></i></div>'
    +'<div class="sub" style="font-weight:800;color:var(--green)">Signed '+signed+' of '+n
    +(updated?' \u00b7 <span style="color:var(--amber)">'+updated+' with new answers to add</span>':'')+'</div>';
  var i=0;
  /* ⛔ СОГЛАСИЕ ИДЁТ ПЕРВЫМ, А НЕ В ОБЩЕЙ СЕМЕЙНОЙ ГРУППЕ В КОНЦЕ. Его подпись усыновляют
     остальные формы пакета — подписанное раньше него подписано без основания. Поймано на
     перегенерации: движок ставил его первым в подачах, а экран рисовал последним.
     ⚠️ IEA при этом остаётся ПОСЛЕДНЕЙ — так сказано семье в ступени 1 («It comes last»).
     Две формы уровня семьи, и позиции у них противоположные: одна открывает пакет, другая
     закрывает. */
  var fam = byChild.__family || [];
  var consent = fam.filter(function(s){ return s.form==='parent_consent' });
  var famRest = fam.filter(function(s){ return s.form!=='parent_consent' });
  if (consent.length){
    html+='<h2>First — this one signs the rest</h2><div class="card">';
    consent.forEach(function(s){
      /* ⛔ И ЗДЕСЬ ПО ФАКТУ, А НЕ ПО ПОРЯДКУ: согласие помечалось «Signed» просто потому,
         что стояло первым. Семья Kutsenko, которая согласия НЕ подписывала, видела галочку. */
      var cs=stateOf(s); var cb=stateBits(s===nextKey?(cs==='updated'?'updated-next':'next'):cs);
      html+='<div class="row"><a href="'+esc(formHref(s))+'" style="color:inherit;text-decoration:none;flex:1">'
        +cb.mark+' '+esc(formName(s.form))+formKeyHint(s.form)+'</a>'
        +'<span class="st '+cb.cls+'">'+cb.text+'</span></div>';
    });
    html+='<p class="sub" style="margin:6px 0 0">One per family. Your signature here is applied to '
      +'every other form — you draw it once.</p></div>';
  }
  PLAN.rounds.forEach(function(r){
    html+='<h2>For '+esc(r.name)+'</h2><div class="card">';
    (byChild[r.key]||[]).forEach(function(s){
      var ks=stateOf(s); var kb=stateBits(s===nextKey?(ks==='updated'?'updated-next':'next'):ks);
      var st = '<span class="st '+kb.cls+'">'+kb.text+'</span>';
      html+='<div class="row"><a href="'+esc(formHref(s))+'" style="color:inherit;text-decoration:none;flex:1">'
        /* ⭐ ДВА РАЗРЕШЕНИЯ РАЗЛИЧИМЫ ПО ЛЕКАРСТВУ. Две одинаковые строки «Administration
           of Medication» не сказали бы матери, какую она уже подписала. */
        +kb.mark+' '+esc(formName(s.form))
        +(s.instance!=null&&s.formData&&s.formData.medication_name
          ? ' <span class="chip">'+esc(s.formData.medication_name)+'</span>' : '')
        +(s.preset?' <span class="chip">'+esc(presetName(s.preset))+'</span>':'')
        +formKeyHint(s.form)+'</a>'+st+'</div>';
    });
    html+='</div>';
  });
  if (famRest.length){
    html+='<h2>Last — for your family</h2><div class="card">';
    /* ⛔ И ЗДЕСЬ СОСТОЯНИЕ ЧИТАЕТСЯ, А НЕ ПИШЕТСЯ НАИЗУСТЬ: строка стояла «Waiting»
       всегда — даже когда IEA этой семьёй уже подана. */
    famRest.forEach(function(s){
      var fs=stateOf(s); var fb=stateBits(s===nextKey?(fs==='updated'?'updated-next':'next'):fs);
      html+='<div class="row"><a href="'+esc(formHref(s))+'" style="color:inherit;text-decoration:none;flex:1">'
        +fb.mark+' '+esc(formName(s.form))+formKeyHint(s.form)+'</a>'
        +'<span class="st '+fb.cls+'">'+fb.text+'</span></div>' });
    html+='<p class="sub" style="margin:6px 0 0">One per family — lists all your children</p></div>';
  }
  var ro=readOnlySlots();
  if (ro.length){
    html+='<h2>To read and to bring</h2><div class="card">';
    ro.forEach(function(k){
      var f=(REG.forms&&REG.forms[k])||{}, cur=f.current
      var url=(cur&&f.versions&&typeof f.versions[cur]==='string')?f.versions[cur]:(f.fallbackUrl||'')
      var hint=(f.kind==='keep')?'Read — no signature needed':'Print &amp; bring back'
      html+='<div class="row">'+(url?'<a href="'+esc(url)+'" style="color:inherit;text-decoration:none;flex:1">':'<span style="flex:1">')
        +'· '+esc(formName(k))+(url?'</a>':'</span>')+'<span class="st info">'+hint+'</span></div>' });
    html+='<p class="sub" style="margin:6px 0 0">These are not signed here — nothing to fill in.</p></div>';
  }
  html+='<div class="card a"><b>Signing happens on the form itself.</b><p class="sub" style="margin:4px 0 0">'
    +'Each form opens filled in; you draw your signature on that form. The questionnaire is not a signature.'
    +'</p></div></div>';
  return html;
}
</script></body></html>

    var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function inked(id){ try{ return !!(window.FormKit&&FormKit.getSig&&FormKit.getSig(id)); }catch(_){ return false; } }
  function lock(dt){ dt.readOnly=true; dt.tabIndex=-1; dt.style.pointerEvents='none'; dt.style.background='#eef1ef'; }
  function stampOne(p){
    var dt=document.getElementById(p.date); if(!dt) return; lock(dt);
    var typed=p.typed?((document.getElementById(p.typed)||{}).value||''):'';
    var has=inked(p.sig)||(typed&&String(typed).trim());
    dt.value = has ? (dt.value||todayISO()) : '';
    if(p.after&&window[p.after]) try{ window[p.after](); }catch(_){}
  }
  function stampAll(){ for(var i=0;i<PAIRS.length;i++) stampOne(PAIRS[i]); }
  function bindTyped(){ PAIRS.forEach(function(p){ if(p.typed){ var e=document.getElementById(p.typed);
    if(e&&!e._sdbound){ e._sdbound=1; e.addEventListener('input',function(){ setTimeout(stampAll,10); }); } } }); }
  document.addEventListener('mouseup',function(){ setTimeout(stampAll,60); });
  document.addEventListener('touchend',function(){ setTimeout(stampAll,60); });
  document.addEventListener('DOMContentLoaded',function(){ bindTyped(); stampAll(); });
  window.addEventListener('load',function(){ bindTyped(); setTimeout(stampAll,300); });
  window.__stampSigDates=stampAll;
})();
</script>
</body>

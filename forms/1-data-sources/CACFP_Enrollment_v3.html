    <input type="tel" id="f_phone" autocomplete="tel" oninput="fmtPhone(this)"  style="position:absolute;z-index:20;font-family:Arial,sans-serif;font-size:12px;padding:2px 4px;box-sizing:border-box;background:rgba(255,253,150,0.9);border:none;border-bottom:2px solid #0066cc;outline:none;left:992.5px;top:1038.7px;width:215.2px;height:46.2px;">
    <input type="text" id="f_street"  style="position:absolute;z-index:20;font-family:Arial,sans-serif;font-size:12px;padding:2px 4px;box-sizing:border-box;background:rgba(255,253,150,0.9);border:none;border-bottom:2px solid #0066cc;outline:none;left:276.9px;top:1081.5px;width:380.6px;height:52.5px;">
    <input type="text" id="f_city"  style="position:absolute;z-index:20;font-family:Arial,sans-serif;font-size:12px;padding:2px 4px;box-sizing:border-box;background:rgba(255,253,150,0.9);border:none;border-bottom:2px solid #0066cc;outline:none;left:725.4px;top:1090.8px;width:209.0px;height:44.6px;">
    <input type="text" id="f_zip"  style="position:absolute;z-index:20;font-family:Arial,sans-serif;font-size:12px;padding:2px 4px;box-sizing:border-box;background:rgba(255,253,150,0.9);border:none;border-bottom:2px solid #0066cc;outline:none;left:1022.7px;top:1092.3px;width:184.4px;height:43.1px;">
    <input type="date" id="f_parent_dob"  style="position:absolute;z-index:20;font-family:Arial,sans-serif;font-size:12px;padding:2px 4px;box-sizing:border-box;background:rgba(255,253,150,0.9);border:none;border-bottom:2px solid #0066cc;outline:none;left:290.4px;top:1142.7px;width:267.9px;height:40.4px;">
    <input type="email" id="f_parent_email" autocomplete="email"  style="position:absolute;z-index:20;font-family:Arial,sans-serif;font-size:12px;padding:2px 4px;box-sizing:border-box;background:rgba(255,253,150,0.9);border:none;border-bottom:2px solid #0066cc;outline:none;left:755.4px;top:1142.7px;width:450.2px;height:37.7px;">

</div>
<script>
const URL_="https://rkabxzqcikojcphwrkty.supabase.co",KEY_="sb_publishable_px0yZk-jUGwRlzEPiVjjXA_N6yYDSp9";
const DAYS=['mon','tue','wed','thu','fri','sat','sun'],MEALS=['b','as','l','ps','su','es'];

function ctrPick(){
  const e=document.getElementById('ctr');
  e.classList.remove('need');
  if(e.value){const f=document.getElementById('f_center');if(f&&!f.value.trim())f.value=e.options[e.selectedIndex].text}
}
function needCenter(){
  const e=document.getElementById('ctr');
  if(e.value)return false;
  e.classList.add('need');e.focus();
  st('\u26a0 Select center first','er');
  return true;
}
function st(m,t){const e=document.getElementById('st');e.textContent=m;e.className=t}
function g(id){const e=document.getElementById(id);return e?e.value:''}
function gc(id){const e=document.getElementById(id);return e&&e.checked}
function s(id,v){const e=document.getElementById(id);if(e&&e.tagName!=='CANVAS')e.value=v??''}
function sc(id,v){const e=document.getElementById(id);if(e)e.checked=!!v}
function clear_(){
  document.querySelectorAll('[id^=f_]').forEach(e=>{if(e.tagName!=='CANVAS')e.value=''});document.querySelectorAll('select[id^=f_]').forEach(e=>e.value='');
  document.querySelectorAll('[id^=cb_]').forEach(e=>e.checked=false);
  clearSig('f_parent_sig');document.getElementById('exp').textContent='';st('Cleared','in');
}
function calcAge(){const d=g('f_dob');if(!d)return;const b=new Date(d),n=new Date();let a=n.getFullYear()-b.getFullYear();const m=n.getMonth()-b.getMonth();if(m<0||(m===0&&n.getDate()<b.getDate()))a--;s('f_age',a>=0?a:'')}
function expDate(sig){const d=new Date(sig);return new Date(d.getFullYear()+1,d.getMonth()+1,0)} // last day of month, +12 months
function calcExp(){const sd=g('f_sig_date');if(!sd){document.getElementById('exp').textContent='';return}const e=expDate(sd);document.getElementById('exp').textContent='Expires: '+e.toISOString().split('T')[0]}
async function api(path){const r=await fetch(URL_+path,{headers:{'apikey':KEY_,'Authorization':'Bearer '+KEY_}});if(!r.ok)throw new Error(await r.text());return r.json()}
async function api2(path,data,method='POST'){const r=await fetch(URL_+path,{method,headers:{'apikey':KEY_,'Authorization':'Bearer '+KEY_,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(data)});return r.json()}

async function load_(){
  if(needCenter())return;
  const cid=document.getElementById('cid').value.trim();
  if(!cid){st('\u26a0 Enter Child ID, then press Load','er');document.getElementById('cid').focus();return}
  st('Loading...','in');
  try{
    const[c]=await api(`/rest/v1/children?child_id=eq.${cid}&select=*`);
    if(!c){st('Not found: '+cid,'er');return}
    s('f_child_name',c.full_name);s('f_dob',c.date_of_birth);calcAge();
    if(c.center_id){const[ct]=await api(`/rest/v1/centers?center_id=eq.${c.center_id}&select=center_name`);if(ct)s('f_center',ct.center_name)}
    if(c.family_id){
      const[f]=await api(`/rest/v1/families?family_id=eq.${c.family_id}&select=*`);
      if(f){s('f_street',f.address_street);s('f_city',f.address_city);s('f_zip',f.address_zip);s('f_phone',f.phone_home||f.parent1_phone_cell);s('f_parent_email',f.parent1_email)}
    }
    // last saved CACFP enrollment form for this child
    const[sub]=await api(`/rest/v1/enrollment_submissions?child_id=eq.${cid}&submission_type=eq.cacfp_enrollment&order=created_at.desc&limit=1`);
    if(sub&&sub.form_data){
      const fd=sub.form_data;
      DAYS.forEach(d=>{const r=fd.schedule&&fd.schedule[d];if(!r)return;
        sc('cb_'+d,r.in_care);['arr1','dep1','arr2','dep2'].forEach(k=>s(`f_${d}_${k}`,r[k]));
        MEALS.forEach(m=>sc(`cb_${d}_${m}`,r.meals&&r.meals[m]));
      });
      sc('cb_varies',fd.schedule_varies);
      if(fd.parent_birthdate)s('f_parent_dob',fd.parent_birthdate);
      if(sub.signature_date){s('f_sig_date',sub.signature_date);calcExp()}
    }
    st('Loaded: '+c.full_name,'ok');
  }catch(e){st('Error: '+e.message,'er');console.error(e)}
}

async function save_(){
  if(needCenter())return;
  const cid=document.getElementById('cid').value.trim();
  if(!cid){st('\u26a0 Enter Child ID, then press Save','er');document.getElementById('cid').focus();return}
  st('Saving...','in');
  try{
    const[c]=await api(`/rest/v1/children?child_id=eq.${cid}&select=child_id,center_id`);
    if(!c){st('Child not found','er');return}
    const schedule={};
    DAYS.forEach(d=>{schedule[d]={in_care:gc('cb_'+d),
      arr1:g(`f_${d}_arr1`),dep1:g(`f_${d}_dep1`),arr2:g(`f_${d}_arr2`),dep2:g(`f_${d}_dep2`),
      meals:Object.fromEntries(MEALS.map(m=>[m,gc(`cb_${d}_${m}`)]))}});
    const sigDate=g('f_sig_date')||new Date().toISOString().split('T')[0];
    const form_data={type:'cacfp_enrollment',center_name:g('f_center'),child_name:g('f_child_name'),
      age:g('f_age'),birthdate:g('f_dob'),schedule,schedule_varies:gc('cb_varies'),
      day_phone:g('f_phone'),mailing:{street:g('f_street'),city:g('f_city'),zip:g('f_zip')},
      parent_birthdate:g('f_parent_dob'),parent_email:g('f_parent_email'),
      expires_on:expDate(sigDate).toISOString().split('T')[0]};
    const sigs={parent_sig:getSigData('f_parent_sig')};
    const[sub]=await api(`/rest/v1/enrollment_submissions?child_id=eq.${cid}&submission_type=eq.cacfp_enrollment&order=created_at.desc&limit=1`);
    if(sub)await api2(`/rest/v1/enrollment_submissions?id=eq.${sub.id}`,{form_data,signatures:sigs,signature_date:sigDate},'PATCH');
    else await api2('/rest/v1/enrollment_submissions',{child_id:cid,center_id:c.center_id,form_data,signatures:sigs,signature_date:sigDate,submission_type:'cacfp_enrollment',status:'pending'});
    calcExp();st('Saved!','ok');
  }catch(e){st('Error: '+e.message,'er');console.error(e)}
}

// Signature pad
function initSigPad(id){
  const canvas=document.getElementById(id);if(!canvas)return;
  const ctx=canvas.getContext('2d');
  ctx.strokeStyle='#000080';ctx.lineWidth=1.8;ctx.lineCap='round';ctx.lineJoin='round';
  let drawing=false,lx,ly;
  function pos(e){const r=canvas.getBoundingClientRect(),sx=canvas.width/r.width,sy=canvas.height/r.height,src=e.touches?e.touches[0]:e;return{x:(src.clientX-r.left)*sx,y:(src.clientY-r.top)*sy}}
  function dn(e){e.preventDefault();drawing=true;const p=pos(e);lx=p.x;ly=p.y;ctx.beginPath();ctx.arc(lx,ly,0.8,0,Math.PI*2);ctx.fill()}
  function mv(e){e.preventDefault();if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p.x,p.y);ctx.stroke();lx=p.x;ly=p.y}
  function up(){drawing=false}
  canvas.addEventListener('mousedown',dn);canvas.addEventListener('mousemove',mv);
  canvas.addEventListener('mouseup',up);canvas.addEventListener('mouseleave',up);
  canvas.addEventListener('touchstart',dn,{passive:false});
  canvas.addEventListener('touchmove',mv,{passive:false});
  canvas.addEventListener('touchend',up);
}
function clearSig(id){const c=document.getElementById(id);if(c)c.getContext('2d').clearRect(0,0,c.width,c.height)}
function getSigData(id){const c=document.getElementById(id);if(!c)return null;const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;return d.some((v,i)=>i%4===3&&v>0)?c.toDataURL('image/png'):null}

// ── Пакетный стандарт §5 ──
function fmtPhone(e){
  let d=e.value.replace(/\D/g,'').slice(0,10);
  e.value=d.length>6?`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`:d.length>3?`(${d.slice(0,3)}) ${d.slice(3)}`:d;
}
document.addEventListener('DOMContentLoaded',()=>{
  const sd=document.getElementById('f_sig_date');
  if(sd&&!sd.value){sd.value=new Date().toISOString().split('T')[0];calcExp()}
});
let _dtSwap=[];
window.addEventListener('beforeprint',()=>{
  _dtSwap=[];
  const sd=document.getElementById('f_sig_date');
  if(sd&&sd.dataset.touched==='0'){sd.value=new Date().toISOString().split('T')[0];calcExp()}
  document.querySelectorAll('input[type=date]').forEach(e=>{if(!e.value){_dtSwap.push(e);e.type='text'}});
});
window.addEventListener('afterprint',()=>{_dtSwap.forEach(e=>e.type='date');_dtSwap=[]});

initSigPad('f_parent_sig');
</script>
